name: Trinket
options:
  bundleIdPrefix: com.ryanmcintire
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "26.0"
fileGroups:
  - QuickSmoke.xctestplan
  - Smoke.xctestplan
  - BattlePerformance.xctestplan
  - FullUI.xctestplan
  - Integration.xctestplan
packages:
  TrinketCore:
    path: Packages/TrinketCore
  TrinketContent:
    path: Packages/TrinketContent
  BattleEngine:
    path: Packages/BattleEngine
  TrinketBattleRuntime:
    path: Packages/TrinketBattleRuntime
  TrinketPersistence:
    path: Packages/TrinketPersistence
  TrinketDesignSystem:
    path: Packages/TrinketDesignSystem
  TrinketTestSupport:
    path: Packages/TrinketTestSupport
  TrinketFeatureSupport:
    path: Packages/TrinketFeatureSupport
  TrinketBattleFeature:
    path: Packages/TrinketBattleFeature
  TrinketAppState:
    path: Packages/TrinketAppState
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      ASSETCATALOG_COMPILER_OPTIMIZATION: time
    Release:
      ASSETCATALOG_COMPILER_OPTIMIZATION: space
targets:
  Trinket:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # Swift-only synchronized roots. Heavy Assets/Media/AppIcon are explicit
      # source entries (buildPhase resources) so actool/audio churn does not resync
      # the whole app tree. Prefer `sources` over `resources:` — XcodeGen + xcode16_0
      # drops standalone `resources:` when synchronized folders are present.
      # Do not name the media folder `Resources` — a top-level Resources directory
      # in an iOS .app breaks codesign.
      - path: Trinket/App
        type: syncedFolder
      - path: Trinket/Features
        type: syncedFolder
        excludes:
          - "**/*.md"
      - path: Trinket/Assets.xcassets
      - path: Trinket/Media
        type: folder
      - path: Trinket/AppIcon.icon
      - path: Trinket/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: Trinket/Trinket.entitlements
    dependencies:
      - package: TrinketCore
      - package: TrinketContent
      - package: BattleEngine
      - package: TrinketBattleRuntime
      - package: TrinketPersistence
      - package: TrinketDesignSystem
      - package: TrinketFeatureSupport
        product: TrinketFeatureContracts
      - package: TrinketFeatureSupport
        product: TrinketFeatureAdapters
      - package: TrinketBattleFeature
      - package: TrinketAppState
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanmcintire.Trinket
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # Unlock >60Hz CADisplayLink / CAAnimation on ProMotion iPhones (Apple opt-in).
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        # remote-notification reserved for CloudKit sync wakeups after Developer Program / F2 enablement.
  TrinketUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TrinketUITests
        type: syncedFolder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: Trinket
      - package: TrinketFeatureSupport

schemes:
  Trinket:
    build:
      targets:
        Trinket: all
    test:
      testPlans:
        - path: QuickSmoke.xctestplan
          defaultPlan: true
        - path: Smoke.xctestplan
        - path: BattlePerformance.xctestplan
        - path: FullUI.xctestplan
        - path: Integration.xctestplan
      targets:
        - TrinketUITests
    run:
      target: Trinket
