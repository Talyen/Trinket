name: Trinket
options:
  bundleIdPrefix: com.ryanmcintire
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "26.0"
fileGroups:
  - StoreKit/Trinket.storekit
  - Smoke.xctestplan
  - BattlePerformance.xctestplan
  - FullUI.xctestplan
packages:
  TrinketCore:
    path: Packages/TrinketCore
  TrinketContent:
    path: Packages/TrinketContent
  BattleEngine:
    path: Packages/BattleEngine
  TrinketPersistence:
    path: Packages/TrinketPersistence
  TrinketDesignSystem:
    path: Packages/TrinketDesignSystem
  TrinketFeatureSupport:
    path: Packages/TrinketFeatureSupport
  TrinketBattleFeature:
    path: Packages/TrinketBattleFeature
  TrinketAppState:
    path: Packages/TrinketAppState
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: "Y968D69P94"
    CLOUDKIT_SYNC_ENABLED: "NO"
  configs:
    Debug:
      ASSETCATALOG_COMPILER_OPTIMIZATION: time
      APS_ENVIRONMENT: development
      CLOUDKIT_ENVIRONMENT: Development
    Release:
      ASSETCATALOG_COMPILER_OPTIMIZATION: space
      APS_ENVIRONMENT: production
      CLOUDKIT_ENVIRONMENT: Production
targets:
  Trinket:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # Swift-only synchronized roots. Heavy Assets/Media/AppIcon are explicit
      # source entries (buildPhase resources) so actool/audio churn does not resync
      # the whole app tree. Prefer `sources` over `resources:` — XcodeGen + xcode16_0
      # drops standalone `resources:` when synchronized folders are present.
      # Do not name the media folder `Resources` — a top-level Resources directory
      # in an iOS .app breaks codesign.
      - path: Trinket/App
        type: syncedFolder
      - path: Trinket/Features
        type: syncedFolder
        excludes:
          - "**/*.md"
      - path: Trinket/Assets.xcassets
      - path: Trinket/Media
        type: folder
      - path: Trinket/AppIcon.icon
      - path: Trinket/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: StoreKit/Trinket.storekit
        buildPhase: resources
    entitlements:
      path: Trinket/Trinket.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.ryanmcintire.Trinket
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.icloud-container-environment: $(CLOUDKIT_ENVIRONMENT)
    info:
      path: Trinket/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TrinketCloudEnvironment: $(CLOUDKIT_ENVIRONMENT)
        TrinketCloudSyncEnabled: $(CLOUDKIT_SYNC_ENABLED)
        UIBackgroundModes:
          - remote-notification
          - fetch
    dependencies:
      - sdk: StoreKit.framework
      - package: TrinketCore
      - package: TrinketContent
      - package: BattleEngine
      - package: TrinketPersistence
      - package: TrinketDesignSystem
      - package: TrinketFeatureSupport
        product: TrinketFeatureContracts
      - package: TrinketFeatureSupport
        product: TrinketFeatureAdapters
      - package: TrinketBattleFeature
      - package: TrinketAppState
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanmcintire.Trinket
        "ENTITLEMENTS_ALLOWED[sdk=iphonesimulator*]": YES
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # Unlock >60Hz CADisplayLink / CAAnimation on ProMotion iPhones (Apple opt-in).
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
  TrinketUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TrinketUITests
        type: syncedFolder
      - path: StoreKit/Trinket.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: Trinket
      - package: TrinketFeatureSupport

schemes:
  Trinket:
    build:
      targets:
        Trinket: all
    test:
      testPlans:
        - path: Smoke.xctestplan
          defaultPlan: true
        - path: BattlePerformance.xctestplan
        - path: FullUI.xctestplan
      targets:
        - TrinketUITests
    run:
      target: Trinket
      storeKitConfiguration: StoreKit/Trinket.storekit
  Trinket Development:
    build:
      targets:
        Trinket: all
    run:
      config: Debug
      target: Trinket
      storeKitConfiguration: StoreKit/Trinket.storekit
