name: Trinket
options:
  bundleIdPrefix: com.ryanmcintire
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "26.0"
fileGroups:
  - Unit.xctestplan
  - QuickSmoke.xctestplan
  - Smoke.xctestplan
  - BattlePerformance.xctestplan
  - FullUI.xctestplan
  - Integration.xctestplan
packages:
  TrinketCore:
    path: Packages/TrinketCore
  TrinketContent:
    path: Packages/TrinketContent
  BattleEngine:
    path: Packages/BattleEngine
  TrinketPersistence:
    path: Packages/TrinketPersistence
  TrinketDesignSystem:
    path: Packages/TrinketDesignSystem
  TrinketTestSupport:
    path: Packages/TrinketTestSupport
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Trinket:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Trinket
        type: syncedFolder
        excludes:
          - PrivacyInfo.xcprivacy
          - "**/*.md"
    resources:
      - path: Trinket/PrivacyInfo.xcprivacy
    entitlements:
      path: Trinket/Trinket.entitlements
    dependencies:
      - package: TrinketCore
      - package: TrinketContent
      - package: BattleEngine
      - package: TrinketPersistence
      - package: TrinketDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanmcintire.Trinket
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # Unlock >60Hz CADisplayLink / CAAnimation on ProMotion iPhones (Apple opt-in).
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        # remote-notification reserved for CloudKit sync wakeups after Developer Program / F2 enablement.
  TrinketUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TrinketUITests
        type: syncedFolder
      - path: Trinket/Shared
        type: syncedFolder
        includes:
          - AccessibilityID.swift
          - FramePacing.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Trinket
  TrinketTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TrinketTests
        type: syncedFolder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_CODE_COVERAGE: YES
        CLANG_ENABLE_CODE_COVERAGE: YES
    dependencies:
      - target: Trinket
      - package: TrinketCore
      - package: TrinketContent
      - package: BattleEngine
      - package: TrinketPersistence
      - package: TrinketDesignSystem
      - package: TrinketTestSupport

schemes:
  Trinket:
    build:
      targets:
        Trinket: all
    test:
      testPlans:
        - path: Unit.xctestplan
        - path: QuickSmoke.xctestplan
          defaultPlan: true
        - path: Smoke.xctestplan
        - path: BattlePerformance.xctestplan
        - path: FullUI.xctestplan
        - path: Integration.xctestplan
      targets:
        - TrinketTests
        - TrinketUITests
    run:
      target: Trinket
