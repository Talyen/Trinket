name: Trinket
options:
  bundleIdPrefix: com.ryanmcintire
  deploymentTarget:
    iOS: "26.0"
fileGroups:
  - Unit.xctestplan
  - Smoke.xctestplan
  - FullUI.xctestplan
  - Integration.xctestplan
packages:
  TrinketCore:
    path: Packages/TrinketCore
  TrinketContent:
    path: Packages/TrinketContent
  BattleEngine:
    path: Packages/BattleEngine
  TrinketPersistence:
    path: Packages/TrinketPersistence
  TrinketDesignSystem:
    path: Packages/TrinketDesignSystem
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Trinket:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Trinket
    entitlements:
      path: Trinket/Trinket.entitlements
    dependencies:
      - package: TrinketCore
      - package: TrinketContent
      - package: BattleEngine
      - package: TrinketPersistence
      - package: TrinketDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanmcintire.Trinket
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
  TrinketUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - TrinketUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Trinket
  TrinketTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - TrinketTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Trinket

schemes:
  Trinket:
    build:
      targets:
        Trinket: all
    test:
      testPlans:
        - path: Unit.xctestplan
        - path: Smoke.xctestplan
          defaultPlan: true
        - path: FullUI.xctestplan
        - path: Integration.xctestplan
      targets:
        - TrinketTests
        - TrinketUITests
    run:
      target: Trinket
