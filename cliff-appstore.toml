# git-cliff configuration for App Store / TestFlight release notes (plain text).
# Feeds ReleaseNotes/en-US.txt via ./Scripts/release-notes-user.sh.

[changelog]
header = ""
body = """
{% for commit in commits %}
{% set subject = commit.message | split(pat="\n") | first | trim -%}
{% if subject -%}
• {{ subject }}
{% endif -%}
{% endfor -%}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = "Co-authored-by:.*", replace = "" },
]

commit_parsers = [
  { message = "^feat(\\(.*\\))?!:", group = "features" },
  { message = "^feat(\\(.*\\))?:", group = "features" },
  { message = "^content(\\(.*\\))?!:", group = "features" },
  { message = "^content(\\(.*\\))?:", group = "features" },
  { message = "^fix(\\(.*\\))?!:", group = "fixes" },
  { message = "^fix(\\(.*\\))?:", group = "fixes" },
  { message = "^(Add|Introduce|Implement|Complete|Enable|Extend|Give|Define|Wire|Integrate|Restore|Retheme|Rename|Require|Smooth|Solidify|Unify|Track|Tighten|Split|Thin|Refine|Refactor|Stabilize|Speed up|Improve|Address|Pause|Log|Guard|Switch|Update)", group = "features" },
  { message = "^(Fix|Repair|Guard|Resolve|Correct|Harden)", group = "fixes" },
  { message = "^(Remove|Drop|Delete|Retire)", group = "changes" },
  { message = "^(Merge|Revert|style|Style|style:|test:|ci:|chore|docs:|build:)", skip = true },
  { body = "User-Facing: no", skip = true },
]
