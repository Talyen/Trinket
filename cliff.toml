# git-cliff configuration for Trinket CHANGELOG.md (Keep a Changelog format).
# See Scripts/README.md for usage.

[changelog]
header = """
# Changelog

All notable changes to Trinket are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}

{% endfor %}\
{% else %}\
## [Unreleased]

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}

{% endfor %}\
{% endif %}\
"""
footer = """
{% for release in releases %}
    {% if release.version %}
    {% if release.previous.version %}
  [{{ release.version | trim_start_matches(pat="v") }}]: \
https://github.com/Talyen/Trinket/compare/{{ release.previous.version }}...{{ release.version }}
    {% else %}
  [{{ release.version | trim_start_matches(pat="v") }}]: \
https://github.com/Talyen/Trinket/releases/tag/{{ release.version }}
    {% endif %}
    {% endif %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = "Co-authored-by:.*", replace = "" },
  { pattern = "User-Facing: no", replace = "" },
]

commit_parsers = [
  { message = "^feat(\\(.*\\))?!:", group = "Added" },
  { message = "^feat(\\(.*\\))?:", group = "Added" },
  { message = "^content(\\(.*\\))?!:", group = "Added" },
  { message = "^content(\\(.*\\))?:", group = "Added" },
  { message = "^fix(\\(.*\\))?!:", group = "Fixed" },
  { message = "^fix(\\(.*\\))?:", group = "Fixed" },
  { message = "^perf(\\(.*\\))?!:", group = "Changed" },
  { message = "^perf(\\(.*\\))?:", group = "Changed" },
  { message = "^refactor(\\(.*\\))?!:", group = "Changed" },
  { message = "^refactor(\\(.*\\))?:", group = "Changed" },
  { message = "^(Add|Introduce|Implement|Complete|Enable|Extend|Give|Define|Wire|Integrate|Restore|Retheme|Rename|Require|Smooth|Solidify|Unify|Track|Tighten|Split|Thin|Refine|Stabilize|Speed up|Improve|Address|Pause|Log|Guard|Switch|Update|Remove unused)", group = "Added" },
  { message = "^(Refactor|Extract|Thin app|Retheme)", group = "Changed" },
  { message = "^(Fix|Repair|Guard|Resolve|Correct|Harden|Repair)", group = "Fixed" },
  { message = "^(Remove|Drop|Delete|Retire)", group = "Removed" },
  { message = "^(Merge|Revert)", skip = true },
  { message = "^(style|Style)", skip = true },
  { message = "^style:", skip = true },
  { message = "^test:", skip = true },
  { message = "^ci:", skip = true },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore:", skip = true },
  { message = "^docs:", skip = true },
  { message = "^build:", skip = true },
  { body = "User-Facing: no", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
