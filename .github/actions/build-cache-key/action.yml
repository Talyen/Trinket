name: Build cache key
description: >
  Compose the two-tier DerivedData cache key used by tests.yml.
  nonsource covers toolchain/build-config plus tool-versions.env;
  full adds app/package/test sources, resources, and Scripts/**. Resource, content, localization, and script-only CI edits
  prefix-restore. Path lists for hashFiles live only here so workflows cannot
  drift. Scripts/check-build-cache-paths.sh guards required shared roots against
  Scripts/build-freshness.sh (intentional differences documented there).

inputs:
  artifact-prefix:
    description: Optional prefix for the within-run build artifact name
    required: false
    default: ''

outputs:
  cache-key:
    description: Exact build cache key (build-v2-<nonsource>-<full>)
    value: ${{ steps.export.outputs.cache-key }}
  cache-restore-prefix:
    description: Prefix restore-keys for same-nonsource incremental rebuilds
    value: ${{ steps.export.outputs.cache-restore-prefix }}
  artifact-name:
    description: Within-run DerivedData artifact name
    value: ${{ steps.export.outputs.artifact-name }}

runs:
  using: composite
  steps:
    - name: Export build cache and artifact ids
      id: export
      shell: bash
      run: |
        # nonsource: toolchain/build-config. Scripts/** stays off this
        # prefix so lint/CI script edits prefix-restore; tool-versions.env is
        # the one script that must cold-rebuild. full adds sources + Scripts/**.
        # Resource/content/localization edits reuse compiler state; full still invalidates
        # the exact key and Xcode rebuilds changed generated sources/resources.
        # The committed receipt binds prepared asset bytes and selection/settings.
        # AssetSources masters are omitted from sparse build jobs and build-cache keys.
        toolchain="$(printf 'Xcode %s\nBuild version %s\n' "${XCODE_VERSION:?setup-trinket must select Xcode}" "${XCODE_BUILD:?setup-trinket must select Xcode}" | shasum -a 256 | awk '{print $1}')"
        nonsource="${{ runner.os }}-${{ runner.arch }}-${toolchain}-${{ hashFiles('Scripts/tool-versions.env', 'project.yml', '*.xctestplan') }}"
        full="${{ hashFiles('StoreKit/**', 'Trinket/**', 'TrinketUITests/**', 'Packages/**', 'ContentManifest/**', 'Localization/**', 'ArtManifest/**', 'MusicManifest/**', 'SoundManifest/**', 'Packages/TrinketContent/Sources/TrinketContent/Generated/PreparedAssets.generated.json', 'Scripts/**', 'project.yml', '*.xctestplan') }}"
        echo "cache-key=build-v2-${nonsource}-${full}" >> "$GITHUB_OUTPUT"
        echo "cache-restore-prefix=build-v2-${nonsource}-" >> "$GITHUB_OUTPUT"
        echo "artifact-name=${{ inputs.artifact-prefix }}build-derived-data-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
