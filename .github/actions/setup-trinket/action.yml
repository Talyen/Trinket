name: Setup Trinket CI
description: Homebrew tooling for Trinket CI (swiftformat 0.61.1 pre-installed on macos-26)

runs:
  using: composite
  steps:
    - name: Select Xcode Version
      shell: bash
      run: |
        xcode_path=""
        for version in 26.5.0 26.5 26.4.0 26.4 26.2.0 26.2 26; do
          for path in "/Applications/Xcode_${version}.app" "/Applications/Xcode_${version}"*.app; do
            if [ -d "$path" ]; then
              xcode_path="$path"
              break 2
            fi
          done
        done
        if [ -n "$xcode_path" ]; then
          echo "Selecting Xcode: $xcode_path"
          sudo xcode-select -s "$xcode_path/Contents/Developer"
        else
          echo "Xcode 26.x not found; using runner default."
          xcode-select -p
        fi

    - name: Cache Homebrew
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-tools-1

    - name: Install tooling
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: |
        missing_tools=()
        for tool in xcodegen swiftlint rg xcbeautify; do
          if ! command -v "$tool" &>/dev/null; then
            if [ "$tool" = "rg" ]; then
              missing_tools+=("ripgrep")
            else
              missing_tools+=("$tool")
            fi
          fi
        done
        if [ ${#missing_tools[@]} -gt 0 ]; then
          echo "Installing missing tools: ${missing_tools[*]}"
          brew install "${missing_tools[@]}"
          for formula in "${missing_tools[@]}"; do
            brew link --overwrite "$formula" 2>/dev/null || true
          done
        else
          echo "All required tools are already installed."
        fi
