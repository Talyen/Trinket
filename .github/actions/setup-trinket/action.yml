name: Setup Trinket CI
description: Xcode 26 selection and Homebrew tooling for Trinket CI on macos-latest

runs:
  using: composite
  steps:
    - name: Select Xcode Version
      shell: bash
      run: |
        xcode_path=""
        for version in 26.5.0 26.5 26.4.0 26.4 26.2.0 26.2 26; do
          for path in "/Applications/Xcode_${version}.app" "/Applications/Xcode_${version}"*.app; do
            if [ -d "$path" ]; then
              xcode_path="$path"
              break 2
            fi
          done
        done
        if [ -z "$xcode_path" ]; then
          echo "Xcode 26.x is required but was not found on this runner." >&2
          echo "Installed Xcode apps:" >&2
          ls -1 /Applications/Xcode*.app 2>/dev/null || true
          exit 1
        fi
        echo "Selecting Xcode: $xcode_path"
        sudo xcode-select -s "$xcode_path/Contents/Developer"
        xcodebuild -version

    - name: Cache Homebrew
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-tools-2-swiftformat-0.61.1-swiftlint-0.65.0

    - name: Install tooling
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: |
        missing_tools=()
        for tool in xcodegen swiftformat swiftlint rg xcbeautify; do
          if ! command -v "$tool" &>/dev/null; then
            case "$tool" in
              rg) missing_tools+=("ripgrep") ;;
              *) missing_tools+=("$tool") ;;
            esac
          fi
        done
        if [ ${#missing_tools[@]} -gt 0 ]; then
          echo "Installing missing tools: ${missing_tools[*]}"
          brew install "${missing_tools[@]}"
          for formula in "${missing_tools[@]}"; do
            brew link --overwrite "$formula" 2>/dev/null || true
          done
        else
          echo "All required tools are already installed."
        fi

    - name: Verify pinned tool versions
      shell: bash
      run: |
        expected_swiftformat="0.61.1"
        expected_swiftlint="0.65.0"
        actual_swiftformat="$(swiftformat --version)"
        actual_swiftlint="$(swiftlint version)"
        if [ "$actual_swiftformat" != "$expected_swiftformat" ]; then
          echo "SwiftFormat version mismatch: expected $expected_swiftformat, found $actual_swiftformat" >&2
          exit 1
        fi
        if [ "$actual_swiftlint" != "$expected_swiftlint" ]; then
          echo "SwiftLint version mismatch: expected $expected_swiftlint, found $actual_swiftlint" >&2
          exit 1
        fi
        echo "SwiftFormat $actual_swiftformat and SwiftLint $actual_swiftlint verified."
