name: Setup Trinket CI
description: Xcode 26 selection and pinned tooling for Trinket CI on macos-26

runs:
  using: composite
  steps:
    - name: Select Xcode Version
      shell: bash
      run: |
        # DerivedData and generated project output depend on this exact toolchain.
        # shellcheck source=../../Scripts/tool-versions.env
        source Scripts/tool-versions.env
        preferred_versions=("$XCODE_VERSION")
        xcode_path=""
        for version in "${preferred_versions[@]}"; do
          for path in "/Applications/Xcode_${version}.app" "/Applications/Xcode_${version}"*.app; do
            if [ -d "$path" ]; then
              xcode_path="$path"
              break 2
            fi
          done
        done
        if [ -z "$xcode_path" ]; then
          echo "Xcode ${XCODE_VERSION} is required but was not found on this runner." >&2
          echo "Installed Xcode apps:" >&2
          ls -1 /Applications/Xcode*.app 2>/dev/null || true
          exit 1
        fi
        echo "Selecting Xcode: $xcode_path"
        sudo xcode-select -s "$xcode_path/Contents/Developer"
        # Prime first-launch components / ibtoold XPC agents used by Icon Composer .icon.
        sudo xcodebuild -runFirstLaunch
        xcodebuild -version
        echo "XCODE_PATH=$xcode_path" >> "$GITHUB_ENV"

    - name: Cache pinned CI tools
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .tools
        key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/tool-versions.env') }}

    - name: Install pinned CI tools
      shell: bash
      run: ./Scripts/ensure-ci-tools.sh

    - name: Verify pinned tool versions
      shell: bash
      run: |
        # shellcheck source=../../Scripts/tool-versions.env
        source Scripts/tool-versions.env
        export PATH="$PWD/.tools:$PATH"
        actual_swiftformat="$(swiftformat --version)"
        actual_swiftlint="$(swiftlint version)"
        actual_xcodegen="$(xcodegen --version | awk '{print $NF}')"
        actual_ripgrep="$(rg --version | head -n 1 | awk '{print $2}')"
        if [ "$actual_swiftformat" != "$SWIFTFORMAT_VERSION" ]; then
          echo "SwiftFormat version mismatch: expected $SWIFTFORMAT_VERSION, found $actual_swiftformat" >&2
          exit 1
        fi
        if [ "$actual_swiftlint" != "$SWIFTLINT_VERSION" ]; then
          echo "SwiftLint version mismatch: expected $SWIFTLINT_VERSION, found $actual_swiftlint" >&2
          exit 1
        fi
        if [ "$actual_xcodegen" != "$XCODEGEN_VERSION" ]; then
          echo "XcodeGen version mismatch: expected $XCODEGEN_VERSION, found $actual_xcodegen" >&2
          exit 1
        fi
        if [ "$actual_ripgrep" != "$RIPGREP_VERSION" ]; then
          echo "ripgrep version mismatch: expected $RIPGREP_VERSION, found $actual_ripgrep" >&2
          exit 1
        fi
        echo "SwiftFormat $actual_swiftformat, SwiftLint $actual_swiftlint, XcodeGen $actual_xcodegen, and ripgrep $actual_ripgrep verified."
        echo "PATH=$PWD/.tools:$PATH" >> "$GITHUB_ENV"

    - name: Clear cached test diagnostics
      shell: bash
      run: ./Scripts/ci-diagnostics.sh --reset .DerivedData/TestResults
