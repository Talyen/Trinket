name: Setup Trinket CI
description: Select the newest installed Xcode and pinned tooling for Trinket CI

runs:
  using: composite
  steps:
    - name: Select Xcode Version
      shell: bash
      run: |
        # Trinket always adopts the newest installed Xcode. Pin an older one
        # only for bisection via TRINKET_XCODE_VERSION (exact marketing version).
        best_path=""
        best_version=""
        best_build=""
        for path in /Applications/Xcode*.app; do
          [ -d "$path" ] || continue
          plist="$path/Contents/Info.plist"
          [ -f "$plist" ] || continue
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" 2>/dev/null || true)"
          build="$(/usr/libexec/PlistBuddy -c 'Print :DTXcodeBuild' "$plist" 2>/dev/null || true)"
          [ -n "$version" ] || continue
          if [ -n "${TRINKET_XCODE_VERSION:-}" ]; then
            if [ "$version" = "$TRINKET_XCODE_VERSION" ]; then
              best_path="$path"
              best_version="$version"
              best_build="$build"
              break
            fi
            continue
          fi
          if [ -z "$best_path" ]; then
            best_path="$path"
            best_version="$version"
            best_build="$build"
          elif [ "$version" != "$best_version" ] \
            && [ "$(printf '%s\n%s\n' "$best_version" "$version" | sort -V | tail -n 1)" = "$version" ]; then
            best_path="$path"
            best_version="$version"
            best_build="$build"
          elif [ "$version" = "$best_version" ] && [[ "$build" > "$best_build" ]]; then
            best_path="$path"
            best_version="$version"
            best_build="$build"
          fi
        done
        if [ -z "$best_path" ]; then
          if [ -n "${TRINKET_XCODE_VERSION:-}" ]; then
            echo "TRINKET_XCODE_VERSION=${TRINKET_XCODE_VERSION} matches no installed Xcode." >&2
          else
            echo "No Xcode installation found on this runner." >&2
          fi
          echo "Installed Xcode apps:" >&2
          ls -1d /Applications/Xcode*.app 2>/dev/null || true
          exit 1
        fi
        echo "Selecting Xcode: $best_path ($best_version, build $best_build)"
        sudo xcode-select -s "$best_path/Contents/Developer"
        xcodebuild -version
        echo "XCODE_PATH=$best_path" >> "$GITHUB_ENV"
        echo "XCODE_VERSION=$best_version" >> "$GITHUB_ENV"
        echo "XCODE_BUILD=$best_build" >> "$GITHUB_ENV"

    - name: Ensure Metal toolchain
      shell: bash
      run: |
        # Slim preview images (e.g. xcode-27 beta) omit the Metal toolchain,
        # which fails app/package test builds with "cannot execute tool
        # 'metal'". Download on demand; no-op when already installed.
        set -euo pipefail
        if xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q '^Status: installed'; then
          echo "Metal toolchain already installed."
        else
          echo "Downloading Metal toolchain..."
          sudo xcodebuild -downloadComponent MetalToolchain
          xcodebuild -showComponent MetalToolchain
        fi

    - name: Cache pinned CI tools
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v4
      with:
        path: .tools
        key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/tool-versions.env') }}

    - name: Install pinned CI tools
      shell: bash
      run: ./Scripts/ensure-ci-tools.sh

    - name: Verify pinned tool versions
      shell: bash
      run: |
        ./Scripts/ensure-ci-tools.sh --check
        echo "PATH=$PWD/.tools:$PATH" >> "$GITHUB_ENV"
