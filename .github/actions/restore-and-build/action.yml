name: Restore and build
description: >
  Shared DerivedData warm-cache restore + build-for-testing used by tests.yml
  build. Optionally prune, save cache on miss, and
  upload the within-run artifact for test fan-out. tests.yml passes --app-only
  so smoke and exhaustive UI can start without waiting on package schemes.

inputs:
  artifact-prefix:
    description: Optional prefix for the within-run build artifact name
    required: false
    default: ''
  build-command:
    description: Command to build for testing after cache restore
    required: false
    default: './Scripts/build-for-testing.sh'
  save-cache:
    description: Save warm cache when restore was not an exact hit (true/false)
    required: false
    default: 'false'
  prune:
    description: Prune DerivedData before cache/artifact save (true/false)
    required: false
    default: 'false'
  upload-artifact:
    description: Upload pruned .DerivedData for within-run test fan-out (true/false)
    required: false
    default: 'false'
  skip-build:
    description: Restore cache only (unit job); skip compile, prune, save, and upload
    required: false
    default: 'false'

outputs:
  artifact-name:
    description: Within-run DerivedData artifact name
    value: ${{ steps.ids.outputs.artifact-name }}
  cache-key:
    description: Exact build cache key
    value: ${{ steps.ids.outputs.cache-key }}
  cache-hit:
    description: Whether restore was an exact cache key hit
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Export build cache and artifact ids
      id: ids
      uses: ./.github/actions/build-cache-key
      with:
        artifact-prefix: ${{ inputs.artifact-prefix }}

    - name: Restore warm build cache
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .DerivedData
        # Exact hit = identical tree. Prefix hit = same nonsource, safe incremental rebuild.
        key: ${{ steps.ids.outputs.cache-key }}
        restore-keys: |
          ${{ steps.ids.outputs.cache-restore-prefix }}

    - name: Clear cached test diagnostics after cache restore
      shell: bash
      run: ./Scripts/ci-diagnostics.sh --reset .DerivedData/TestResults

    - name: Build for testing
      if: inputs.skip-build != 'true'
      id: build
      shell: bash
      env:
        SKIP_GENERATE: 1
      run: >-
        python3 Scripts/output-profile.py run
        --label ci-build
        --policy ci-build
        -- ${{ inputs.build-command }}

    - name: Upload build failure diagnostics
      if: failure() && inputs.skip-build != 'true' && steps.build.outcome == 'failure'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ steps.ids.outputs.artifact-name }}-failure-diagnostics
        path: .DerivedData/TestResults
        include-hidden-files: true
        retention-days: 7
        if-no-files-found: ignore

    - name: Report CI output profile
      if: always() && inputs.skip-build != 'true'
      continue-on-error: true
      shell: bash
      run: python3 Scripts/output-profile.py report --ci .DerivedData/OutputProfiles --actionable --top 3

    - name: Upload CI output profile
      if: always() && inputs.skip-build != 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ steps.ids.outputs.artifact-name }}-output-profile
        path: .DerivedData/OutputProfiles/
        include-hidden-files: true
        retention-days: 30
        if-no-files-found: ignore

    - name: Remove output profile before build artifact save
      if: always() && inputs.skip-build != 'true'
      shell: bash
      run: |
        profile_dir="${TRINKET_OUTPUT_PROFILE_DIR:-.DerivedData/OutputProfiles}"
        if [[ "$profile_dir" == ".DerivedData/OutputProfiles" ]]; then
          rm -rf "$profile_dir"
        fi

    - name: Prune DerivedData before cache/artifact save
      if: inputs.skip-build != 'true' && inputs.prune == 'true'
      shell: bash
      run: ./Scripts/prune-derived-data-cache.sh

    - name: Save warm build cache
      if: inputs.skip-build != 'true' && inputs.save-cache == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .DerivedData
        key: ${{ steps.ids.outputs.cache-key }}

    - name: Stage --no-build test products
      if: inputs.skip-build != 'true' && inputs.upload-artifact == 'true'
      shell: bash
      run: ./Scripts/stage-ci-test-artifact.sh

    - name: Upload build products for test jobs
      if: inputs.skip-build != 'true' && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ steps.ids.outputs.artifact-name }}
        path: .DerivedData/ci-test-artifact
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
