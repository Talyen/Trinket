name: Test job
description: Download CI build products, run tests, aggregate diagnostics, upload artifacts

inputs:
  command:
    description: Shell command to run tests
    required: true
  artifact-name:
    description: Artifact name for uploaded test results
    required: true
  build-artifact:
    description: Artifact name containing pruned .DerivedData from the build job
    required: true
  rebuild-command:
    description: Shell command to rebuild on artifact miss (default full build-for-testing)
    required: false
    default: './Scripts/build-for-testing.sh'
  timing-mode:
    description: Optional test-timing.sh mode for assert-budget (empty to skip)
    required: false
    default: ''
  timing-budget-seconds:
    description: Wall-clock budget for assert-budget when timing-mode is set
    required: false
    default: '0'
  keep-diagnostics:
    description: Keep local test diagnostics after artifact staging (for investigations)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Download build products
      id: download-build
      continue-on-error: true
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        # upload-artifact v4 strips the path LCA, so .DerivedData upload stores
        # contents without that prefix — download into .DerivedData to restore it.
        name: ${{ inputs.build-artifact }}
        path: .DerivedData

    - name: Rebuild when artifact miss
      if: steps.download-build.outcome != 'success'
      shell: bash
      env:
        SKIP_GENERATE: 1
      run: |
        echo "Build artifact miss for ${{ inputs.build-artifact }}; rebuilding with: ${{ inputs.rebuild-command }}"
        ${{ inputs.rebuild-command }}

    - name: Clear cached test diagnostics after build restore
      shell: bash
      run: ./Scripts/ci-diagnostics.sh --reset .DerivedData/TestResults

    - name: Run tests
      shell: bash
      env:
        SKIP_GENERATE: 1
        CI: true
        TRINKET_CLEANUP_TEST_ARTIFACTS: 0
      run: ${{ inputs.command }}

    - name: Report timing budget
      if: inputs.timing-mode != ''
      shell: bash
      run: |
        set +e
        output="$(./Scripts/test-timing.sh assert-budget \
          --mode "${{ inputs.timing-mode }}" \
          --max-wall "${{ inputs.timing-budget-seconds }}" \
          --skip-if-missing 2>&1)"
        status=$?
        set -e
        echo "$output"
        if [ "$status" -ne 0 ]; then
          echo "::warning title=CI timing budget exceeded::$output"
        fi

    - name: Classify CI outcome and report timing
      if: always()
      shell: bash
      run: ./Scripts/ci-diagnostics.sh .DerivedData/TestResults

    - name: Stage bounded test diagnostics artifact
      if: always()
      shell: bash
      run: ./Scripts/ci-diagnostics.sh --stage-artifacts .DerivedData/TestResults .DerivedData/TestResults-artifact

    - name: Clean ephemeral test diagnostics
      if: always()
      shell: bash
      run: |
        if [ "${{ inputs.keep-diagnostics }}" = "true" ]; then
          ./Scripts/ci-diagnostics.sh --cleanup --keep .DerivedData/TestResults
        else
          ./Scripts/ci-diagnostics.sh --cleanup .DerivedData/TestResults
        fi

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      # Passing runs are intentionally ephemeral. Keep forensic artifacts for a
      # failed job or when a caller explicitly opts in.
      if: always() && (failure() || inputs.keep-diagnostics == 'true')
      with:
        name: ${{ inputs.artifact-name }}-${{ github.run_id }}
        path: .DerivedData/TestResults-artifact/
        if-no-files-found: ignore
