name: Test job
description: Restore CI build cache, run tests, aggregate diagnostics, upload artifacts

inputs:
  command:
    description: Shell command to run tests
    required: true
  artifact-name:
    description: Artifact name for uploaded test results
    required: true
  cache-key:
    description: DerivedData cache key from the build job
    required: true
  rebuild-command:
    description: Shell command to rebuild on cache miss (default full build-for-testing)
    required: false
    default: './Scripts/build-for-testing.sh'
  timing-mode:
    description: Optional test-timing.sh mode for assert-budget (empty to skip)
    required: false
    default: ''
  timing-budget-seconds:
    description: Wall-clock budget for assert-budget when timing-mode is set
    required: false
    default: '0'

runs:
  using: composite
  steps:
    - name: Restore build cache
      id: restore-build-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .DerivedData
        key: ${{ inputs.cache-key }}
        fail-on-cache-miss: false

    - name: Rebuild when cache miss
      if: steps.restore-build-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SKIP_GENERATE: 1
      run: |
        echo "Build cache miss for key ${{ inputs.cache-key }}; rebuilding with: ${{ inputs.rebuild-command }}"
        ${{ inputs.rebuild-command }}

    - name: Clear cached test diagnostics after cache restore
      shell: bash
      run: ./Scripts/ci-diagnostics.sh --reset .DerivedData/TestResults

    - name: Run tests
      shell: bash
      env:
        SKIP_GENERATE: 1
        CI: true
      run: ${{ inputs.command }}

    - name: Report timing budget
      if: inputs.timing-mode != ''
      shell: bash
      run: |
        set +e
        output="$(./Scripts/test-timing.sh assert-budget \
          --mode "${{ inputs.timing-mode }}" \
          --max-wall "${{ inputs.timing-budget-seconds }}" \
          --skip-if-missing 2>&1)"
        status=$?
        set -e
        echo "$output"
        if [ "$status" -ne 0 ]; then
          echo "::warning title=CI timing budget exceeded::$output"
        fi

    - name: Classify CI outcome and report timing
      if: always()
      shell: bash
      run: ./Scripts/ci-diagnostics.sh .DerivedData/TestResults

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: ${{ inputs.artifact-name }}-${{ github.run_id }}
        path: .DerivedData/TestResults/
        if-no-files-found: ignore

    - name: Clean test results before cache save
      if: always()
      shell: bash
      run: rm -rf .DerivedData/TestResults/*.xcresult
