name: Test job
description: Download CI build products, run tests, aggregate diagnostics, upload artifacts

inputs:
  command:
    description: Shell command to run tests
    required: true
  artifact-name:
    description: Artifact name for uploaded test results
    required: true
  build-artifact:
    description: Artifact name containing pruned .DerivedData from the build job
    required: false
    default: ''
  rebuild-command:
    description: Shell command to rebuild on artifact miss (default app-only build-for-testing)
    required: false
    default: './Scripts/build-for-testing.sh --app-only'
  preboot-simulator:
    description: Boot the managed simulator while the build artifact downloads (true/false)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Preboot simulator
      if: inputs.preboot-simulator == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/trinket-sim-preboot"
        nohup bash -c '
          set -euo pipefail
          source Scripts/run-env.sh
          trinket_run_env_init
          source Scripts/ensure-simulator.sh
          export TRINKET_SIMULATOR_LOG_DIR="$RUNNER_TEMP/trinket-sim-preboot"
          export RESULTS_DIR="$RUNNER_TEMP/trinket-sim-preboot"
          status=0
          ensure_test_simulator_logged || status=$?
          echo "$status" > "$RUNNER_TEMP/trinket-sim-preboot.status"
        ' >"$RUNNER_TEMP/trinket-sim-preboot/boot.log" 2>&1 &
        echo $! > "$RUNNER_TEMP/trinket-sim-preboot.pid"

    - name: Download build products
      id: download-build
      if: inputs.build-artifact != ''
      continue-on-error: true
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        # upload-artifact v4 strips the path LCA. The build job uploads
        # .DerivedData/ci-test-artifact (Build/Products + stamps); download
        # into .DerivedData to restore that layout.
        name: ${{ inputs.build-artifact }}
        path: .DerivedData

    - name: Rebuild when artifact miss
      if: inputs.build-artifact != '' && steps.download-build.outcome != 'success'
      shell: bash
      env:
        SKIP_GENERATE: 1
      run: |
        echo "Build artifact miss for ${{ inputs.build-artifact }}; rebuilding with: ${{ inputs.rebuild-command }}"
        ${{ inputs.rebuild-command }}

    - name: Wait for simulator preboot
      if: inputs.preboot-simulator == 'true'
      shell: bash
      run: |
        set -euo pipefail
        deadline=$((SECONDS + 180))
        while (( SECONDS < deadline )); do
          if [[ -f "$RUNNER_TEMP/trinket-sim-preboot.status" ]]; then
            cat "$RUNNER_TEMP/trinket-sim-preboot/boot.log" || true
            status="$(cat "$RUNNER_TEMP/trinket-sim-preboot.status")"
            if [[ "$status" != "0" ]]; then
              echo "Simulator preboot failed (status=$status); test.sh will retry boot."
            fi
            # Persist preboot log for xcodebuild infra classifier
            mkdir -p .DerivedData/TestResults
            cp "$RUNNER_TEMP/trinket-sim-preboot/boot.log" .DerivedData/TestResults/simulator.log 2>/dev/null || true
            exit 0
          fi
          sleep 2
        done
        echo "Simulator preboot still running; test.sh will finish booting."
        cat "$RUNNER_TEMP/trinket-sim-preboot/boot.log" || true
        mkdir -p .DerivedData/TestResults
        cp "$RUNNER_TEMP/trinket-sim-preboot/boot.log" .DerivedData/TestResults/simulator.log 2>/dev/null || true

    - name: Clear cached test diagnostics after build restore
      shell: bash
      run: ./Scripts/ci-diagnostics.sh --reset .DerivedData/TestResults

    - name: Run tests
      shell: bash
      env:
        SKIP_GENERATE: 1
        CI: true
        TRINKET_CLEANUP_TEST_ARTIFACTS: 0
      run: ${{ inputs.command }}

    - name: Classify CI outcome and report timing
      if: always()
      shell: bash
      run: ./Scripts/ci-diagnostics.sh .DerivedData/TestResults

    - name: Stage bounded test diagnostics artifact
      if: always()
      shell: bash
      run: ./Scripts/ci-diagnostics.sh --stage-artifacts .DerivedData/TestResults .DerivedData/TestResults-artifact

    - name: Clean ephemeral test diagnostics
      if: always()
      shell: bash
      run: ./Scripts/ci-diagnostics.sh --cleanup .DerivedData/TestResults

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      # Passing runs are intentionally ephemeral. Keep forensic artifacts for a
      # failed job or when a caller explicitly opts in.
      if: always() && failure()
      with:
        name: ${{ inputs.artifact-name }}-${{ github.run_id }}
        path: .DerivedData/TestResults-artifact/
        retention-days: 7
        if-no-files-found: ignore
