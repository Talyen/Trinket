name: Test job
description: Download CI build products, run tests, aggregate diagnostics, upload artifacts

inputs:
  command:
    description: Shell command to run tests
    required: true
  artifact-name:
    description: Artifact name for uploaded test results
    required: true
  build-artifact:
    description: Artifact name containing the test-products tar archive
    required: false
    default: ''
  build-run-id:
    description: Run owning the products (may be an earlier successful exact-commit run)
    required: false
    default: '${{ github.run_id }}'
  rebuild-command:
    description: Shell command to rebuild on artifact miss (default app-only build-for-testing)
    required: false
    default: './Scripts/build-for-testing.sh --app-only'
  defer-cleanup:
    description: Retain comparator results until a following same-runner parity check finishes
    default: 'false'
  artifact-prefix:
    description: Optional prefix for the within-run build artifact name
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Clear cached test diagnostics before test preparation
      shell: bash
      run: |
        ./Scripts/ci-diagnostics.sh --reset .DerivedData/TestResults
        rm -f .DerivedData/TestResults/timing-log.jsonl

    - name: Download build products
      id: download-build
      if: inputs.build-artifact != ''
      continue-on-error: true
      uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v5
      with:
        name: ${{ inputs.build-artifact }}
        run-id: ${{ inputs.build-run-id }}
        github-token: ${{ github.token }}
        path: .DerivedData

    - name: Validate transferred test products or rebuild
      if: inputs.build-artifact != ''
      shell: bash
      env:
        CI: true
        DOWNLOAD_OUTCOME: ${{ steps.download-build.outcome }}
      run: |
        restore_args=()
        if [[ "$DOWNLOAD_OUTCOME" == success ]]; then restore_args+=(--downloaded); fi
        ./Scripts/restore-ci-test-products.sh "${restore_args[@]}" -- ${{ inputs.rebuild-command }}

    - name: Run tests
      shell: bash
      env:
        SKIP_GENERATE: 1
        CI: true
        TRINKET_CLEANUP_TEST_ARTIFACTS: 0
      run: |
        # The test wrapper is the sole simulator preparation/recovery owner.
        # UI recovery keeps completed cases and retries only classified launch
        # failures. Other commands pass through unchanged.
        python3 Scripts/ci-run-budget.py -- python3 Scripts/ci_ui_retry.py ${{ inputs.command }}

    - name: Export localization screenshots and accessibility hierarchies
      if: always() && contains(inputs.command, 'LocalizationUITests')
      shell: bash
      run: python3 Scripts/export-localization-screenshots.py .DerivedData/TestResults .DerivedData/LocalizationScreenshots

    - name: Retain localization screenshots for agent visual review
      if: always() && contains(inputs.command, 'LocalizationUITests')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: ${{ inputs.artifact-prefix }}${{ inputs.artifact-name }}-localization-${{ github.run_id }}-${{ github.run_attempt }}
        path: .DerivedData/LocalizationScreenshots/
        retention-days: 14
        if-no-files-found: error

    - name: Classify CI outcome and report timing
      if: always()
      shell: bash
      run: ./Scripts/ci-diagnostics.sh .DerivedData/TestResults

    - name: Stage bounded test diagnostics artifact
      id: diagnostic-artifacts
      if: always()
      shell: bash
      run: ./Scripts/ci-diagnostics.sh --stage-artifacts .DerivedData/TestResults .DerivedData/TestResults-artifact

    - name: Clean ephemeral test diagnostics
      if: always() && inputs.defer-cleanup != 'true'
      shell: bash
      run: ./Scripts/ci-diagnostics.sh --cleanup .DerivedData/TestResults

    - name: Keep compact test timing evidence
      if: always()
      # Telemetry transport must not turn completed passing tests into a failure.
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: ${{ inputs.artifact-prefix }}${{ inputs.artifact-name }}-timing-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .DerivedData/TestResults-artifact/timing-log.jsonl
          .DerivedData/TestResults-artifact/phase-timing.jsonl
          .DerivedData/TestResults-artifact/ci-diagnostics.json
        retention-days: 14
        if-no-files-found: ignore

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      # Keep both attempts after recovery, even when the final gate passes.
      if: always() && (failure() || steps.diagnostic-artifacts.outputs.retain-forensics == 'true')
      with:
        name: ${{ inputs.artifact-prefix }}${{ inputs.artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .DerivedData/TestResults-artifact/
        retention-days: 14
        if-no-files-found: ignore
