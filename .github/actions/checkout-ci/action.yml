name: Checkout Trinket CI
description: >
  Checkout the repo. sparse=true skips Raw Assets (processed media lives under
  Trinket/Media) so test and app-only build jobs avoid the bulky clone.

inputs:
  sparse:
    description: Exclude Raw Assets from the worktree (true/false)
    required: false
    default: 'false'
  fetch-depth:
    description: git fetch depth
    required: false
    default: '1'

runs:
  using: composite
  steps:
    - name: Checkout
      if: inputs.sparse != 'true'
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Checkout (sparse, no Raw Assets)
      if: inputs.sparse == 'true'
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        sparse-checkout-cone-mode: true
        # Cone mode always keeps root files (project.yml, *.xctestplan).
        sparse-checkout: |
          Scripts
          Packages
          Trinket
          TrinketUITests
          Trinket.xcodeproj
          ContentManifest
          ArtManifest
          MusicManifest
          SoundManifest
          CinematicManifest
          .github

    - name: Assert sparse checkout kept root build inputs
      if: inputs.sparse == 'true'
      shell: bash
      run: |
        set -euo pipefail
        test -f project.yml
        test -f Smoke.xctestplan
        test -f FullUI.xctestplan
        test -f BattlePerformance.xctestplan
