name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      # release.sh runs test-deploy.sh before tagging and the main push runs
      # the full CI suite, so re-running tests here is redundant. Instead,
      # require the tagged commit to be on main with a green Trinket CI run.
      # main and the tag are typically pushed together, so wait for that run
      # to conclude rather than failing while it is still in progress.
      - name: Assert tag is on main with green Trinket CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${REPO}/commits/${TAG}" --jq .sha)"
          echo "Tag ${TAG} points at ${sha}"

          compare_status="$(gh api "repos/${REPO}/compare/main...${sha}" --jq .status)"
          if [ "$compare_status" != "identical" ] && [ "$compare_status" != "behind" ]; then
            echo "::error::Tagged commit ${sha} is not on main (compare status: ${compare_status})."
            exit 1
          fi

          deadline=$(( $(date +%s) + 80 * 60 ))
          while :; do
            # Ignore cancelled runs so a cancel-in-progress race on main does not
            # fail the release; keep waiting for an in-progress or newer run.
            run="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=10" \
              --jq '[.workflow_runs[]
                | select(.event == "push" or .event == "workflow_dispatch")
                | select(.conclusion != "cancelled")
              ] | first // empty')"
            if [ -n "$run" ]; then
              run_status="$(jq -r .status <<<"$run")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
              url="$(jq -r .html_url <<<"$run")"
              if [ "$run_status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "Trinket CI is green for ${sha}: ${url}"
                  exit 0
                fi
                if [ "$conclusion" = "cancelled" ]; then
                  echo "Trinket CI for ${sha} was cancelled; waiting for a newer run..."
                else
                  echo "::error::Trinket CI for ${sha} concluded ${conclusion}: ${url}"
                  exit 1
                fi
              else
                echo "Trinket CI for ${sha} is ${run_status}; waiting..."
              fi
            else
              echo "No active Trinket CI run found yet for ${sha}; waiting..."
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for a green Trinket CI run for ${sha}."
              exit 1
            fi
            sleep 60
          done

  github-release:
    name: GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: ./Scripts/ensure-git-cliff.sh --version

      - name: Validate changelog config
        run: ./Scripts/release-notes.sh validate

      - name: Generate release body
        run: ./Scripts/release-notes.sh github-body "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-body.md"

      - name: Upload App Store notes artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-store-release-notes
          path: ReleaseNotes/en-US.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Trinket ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: false
