name: Gate

on:
  workflow_call:

jobs:
  gate:
    name: Generate and style
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Depth-1 history suffices for changelog validation. blob:limit=1g
          # keeps every blob (validation reads cone-external blobs; sparse
          # checkouts otherwise default to blob:none) while the cone below
          # keeps the working tree lean. Raise the limit if a >=1GB blob
          # ever lands (largest today is tens of MB).
          fetch-depth: 1
          filter: blob:limit=1g
          sparse-checkout-cone-mode: true
          # Cone mode keeps root files (project.yml, *.xctestplan). Skip Raw Assets.
          # Docs, Performance baselines, .agents, Website, .cursor, and
          # .githooks are read by the gate suite.
          sparse-checkout: |
            Scripts
            Packages
            Trinket
            TrinketUITests
            Trinket.xcodeproj
            StoreKit
            ContentManifest
            ArtManifest
            MusicManifest
            SoundManifest
            CinematicManifest
            Docs
            Performance
            Website
            .agents
            .cursor
            .githooks
            .github
      - uses: ./.github/actions/setup-trinket
      # Same semantics as local ./Scripts/ci-gate.sh (single owner).
      - name: CI gate
        run: ./Scripts/ci-gate.sh
