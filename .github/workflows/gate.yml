name: Gate

on:
  workflow_call:
    inputs:
      xcode-build:
        description: Exact candidate product build for latest validation
        type: string
        default: ''
      xcode-channel:
        type: string
        default: verified

jobs:
  gate:
    name: Generate and style
    runs-on: xcode-27
    # Full-source checkout can take eight minutes; the static gate needs five more.
    timeout-minutes: 20
    steps:
      - name: Reserve diagnostic time
        shell: bash
        run: echo "TRINKET_CI_DEADLINE_EPOCH=$(( $(date +%s) + 20 * 60 - 120 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        id: checkout
        timeout-minutes: 10
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '1024'
          GIT_HTTP_LOW_SPEED_TIME: '60'
        with:
          # The pinned git-cliff skips diff statistics for our template, so
          # changelog validation works with the default sparse blob filter.
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          # Cone mode keeps root files (project.yml, *.xctestplan). AssetSources masters are omitted from sparse build jobs.
          # Docs, Performance baselines, .agents, Website, and
          # .githooks are read by the gate suite.
          sparse-checkout: |
            Scripts
            Packages
            Trinket
            TrinketUITests
            Trinket.xcodeproj
            StoreKit
            ContentManifest
            Localization
            ArtManifest
            MusicManifest
            SoundManifest
            Docs
            Performance
            ReleaseNotes
            Website
            .agents
            .githooks
            .github
      - uses: ./.github/actions/setup-trinket
        with:
          xcode-channel: ${{ inputs.xcode-channel }}
          xcode-build: ${{ inputs.xcode-build }}
      # Same semantics as local ./Scripts/ci-gate.sh (single owner).
      - name: CI gate
        env:
          RESULTS_DIR: ${{ github.workspace }}/.DerivedData/TestResults
          TRINKET_CLEANUP_TEST_ARTIFACTS: 0
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR"
          python3 Scripts/ci-run-budget.py -- ./Scripts/ci-gate.sh 2>&1 | tee "$RESULTS_DIR/gate.log"
      - name: Stage bounded gate failure diagnostics
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        run: ./Scripts/ci-diagnostics.sh --stage-gate-artifacts .DerivedData/TestResults .DerivedData/GateResults-artifact
      - name: Upload gate failure diagnostics
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: gate-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .DerivedData/GateResults-artifact/
          retention-days: 14
          if-no-files-found: ignore
