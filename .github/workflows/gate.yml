name: Gate

on:
  workflow_call:

jobs:
  gate:
    name: Generate and style
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      - run: ./Scripts/generate.sh
      - name: Assert generated output is committed
        run: |
          if ! ./Scripts/assert-generated-output.sh; then
            echo "::error::Generated output drifted. Run ./Scripts/generate.sh and commit Trinket.xcodeproj + Generated catalogs."
            exit 1
          fi
      - run: ./Scripts/test.sh style
      - run: ./Scripts/check-module-boundaries.sh
      - run: ./Scripts/check-swift-testing-migration.sh
      - run: ./Scripts/release-notes.sh validate
