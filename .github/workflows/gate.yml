name: Gate

on:
  workflow_call:

jobs:
  gate:
    name: Generate and style
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-trinket
      # Same semantics as local ./Scripts/ci-gate.sh (single owner).
      - name: CI gate
        run: ./Scripts/ci-gate.sh
