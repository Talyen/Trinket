name: Gate

on:
  workflow_call:
    inputs:
      xcode-channel:
        type: string
        default: verified

jobs:
  gate:
    name: Generate and style
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Depth-1 history suffices for changelog validation. blob:limit=1g
          # keeps every blob (validation reads cone-external blobs; sparse
          # checkouts otherwise default to blob:none) while the cone below
          # keeps the working tree lean. Raise the limit if a >=1GB blob
          # ever lands (largest today is tens of MB).
          fetch-depth: 1
          filter: blob:limit=1g
          sparse-checkout-cone-mode: true
          # Cone mode keeps root files (project.yml, *.xctestplan). Raw sources live outside the repository.
          # Docs, Performance baselines, .agents, Website, .cursor, and
          # .githooks are read by the gate suite.
          sparse-checkout: |
            Scripts
            Packages
            Trinket
            TrinketUITests
            Trinket.xcodeproj
            StoreKit
            ContentManifest
            ArtManifest
            MusicManifest
            SoundManifest
            CinematicManifest
            Docs
            Performance
            Website
            .agents
            .cursor
            .githooks
            .github
      - uses: ./.github/actions/setup-trinket
        with:
          xcode-channel: ${{ inputs.xcode-channel }}
      # Same semantics as local ./Scripts/ci-gate.sh (single owner).
      - name: CI gate
        env:
          RESULTS_DIR: ${{ github.workspace }}/.DerivedData/TestResults
          TRINKET_CLEANUP_TEST_ARTIFACTS: 0
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR"
          ./Scripts/ci-gate.sh 2>&1 | tee "$RESULTS_DIR/gate.log"
      - name: Stage bounded gate failure diagnostics
        if: failure()
        run: ./Scripts/ci-diagnostics.sh --stage-gate-artifacts .DerivedData/TestResults .DerivedData/GateResults-artifact
      - name: Upload gate failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: gate-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .DerivedData/GateResults-artifact/
          retention-days: 1
          if-no-files-found: ignore
