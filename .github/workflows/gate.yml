name: Gate

on:
  workflow_call:

jobs:
  gate:
    name: Generate and style
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      # Same semantics as local ./Scripts/ci-gate.sh (single owner).
      - name: CI gate
        run: ./Scripts/ci-gate.sh
