name: Trinket PR

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_HASH: ${{ hashFiles('Trinket/**', 'TrinketTests/**', 'TrinketUITests/**', 'Packages/**', 'ContentManifest/**', 'project.yml', 'Package.resolved', '*.xctestplan') }}
  BUILD_CACHE_KEY: build-${{ github.run_id }}-${{ hashFiles('Trinket/**', 'TrinketTests/**', 'TrinketUITests/**', 'Packages/**', 'ContentManifest/**', 'project.yml', 'Package.resolved', '*.xctestplan') }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  gate:
    uses: ./.github/workflows/gate.yml

  assets-gate:
    name: Asset codegen
    needs: [gate, changes]
    if: needs.changes.outputs.assets == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - run: ./Scripts/generate.sh --assets
      - run: ./Scripts/assert-generated-output.sh --assets

  build:
    name: Build for testing
    needs: [gate, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      SKIP_GENERATE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket

      - name: Restore warm build cache
        uses: actions/cache@v4
        with:
          path: .DerivedData
          key: build-${{ env.CACHE_HASH }}
          restore-keys: |
            build-

      - run: ./Scripts/build-for-testing.sh

      - name: Save build cache for test jobs
        uses: actions/cache/save@v4
        with:
          path: .DerivedData
          key: ${{ env.BUILD_CACHE_KEY }}

  unit:
    name: Unit tests - ${{ matrix.target }}
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        target: [app, TrinketCore, TrinketContent, BattleEngine, TrinketPersistence, TrinketDesignSystem]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          cache-key: ${{ env.BUILD_CACHE_KEY }}
          artifact-name: pr-unit-${{ matrix.target }}
          command: |
            if [ "${{ matrix.target }}" = "app" ]; then
              ./Scripts/test.sh unit TrinketTests --no-build --verbose
            else
              ./Scripts/test-package.sh ${{ matrix.target }} --no-build --verbose
            fi

  smoke:
    name: Smoke UI tests
    needs: build
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          cache-key: ${{ env.BUILD_CACHE_KEY }}
          artifact-name: pr-smoke
          command: ./Scripts/test.sh smoke --no-build --verbose
          timing-mode: smoke
          timing-budget-seconds: '900'
