name: Trinket PR

on:
  pull_request:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Generate and style
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - run: ./Scripts/generate.sh
      - run: ./Scripts/assert-generated-output.sh
      - run: ./Scripts/test.sh style
      - run: ./Scripts/check-module-boundaries.sh
      - run: ./Scripts/release-notes.sh validate

  unit:
    name: Unit tests
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SKIP_GENERATE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .DerivedData
          key: deriveddata-pr-unit-${{ runner.os }}-${{ hashFiles('**/*.swift', 'project.yml', 'Package.resolved') }}
          restore-keys: |
            deriveddata-pr-unit-${{ runner.os }}-
            deriveddata-unit-${{ runner.os }}-app-

      - run: ./Scripts/test.sh unit --verbose

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-unit-results-${{ github.run_id }}
          path: .DerivedData/TestResults/
          if-no-files-found: ignore

      - name: Clean test results before caching
        if: always()
        run: rm -rf .DerivedData/TestResults/*.xcresult

  smoke:
    name: Smoke UI tests
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SKIP_GENERATE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .DerivedData
          key: deriveddata-pr-smoke-${{ runner.os }}-${{ hashFiles('**/*.swift', 'project.yml', 'Package.resolved') }}
          restore-keys: |
            deriveddata-pr-smoke-${{ runner.os }}-
            deriveddata-ui-${{ runner.os }}-smoke-

      - run: ./Scripts/test.sh smoke --verbose

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-smoke-results-${{ github.run_id }}
          path: .DerivedData/TestResults/
          if-no-files-found: ignore

      - name: Clean test results before caching
        if: always()
        run: rm -rf .DerivedData/TestResults/*.xcresult
