name: Trinket PR

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  gate:
    uses: ./.github/workflows/gate.yml

  assets-gate:
    name: Asset codegen
    needs: [gate, changes]
    if: needs.changes.outputs.assets == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - run: ./Scripts/generate.sh --assets
      - run: ./Scripts/assert-generated-output.sh --assets

  build:
    name: Build for testing
    needs: [gate, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    outputs:
      # actions/cache/save has no cache-primary-key output; export the save key from a step.
      build-cache-key: ${{ steps.export-build-cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket

      - name: Export build cache key
        id: export-build-cache-key
        run: echo "key=build-${{ github.run_id }}-${{ hashFiles('Trinket/**', 'TrinketTests/**', 'TrinketUITests/**', 'Packages/**', 'ContentManifest/**', 'project.yml', 'Package.resolved', '*.xctestplan') }}" >> "$GITHUB_OUTPUT"

      - name: Restore warm build cache
        uses: actions/cache/restore@v4
        with:
          path: .DerivedData
          key: build-${{ hashFiles('Trinket/**', 'TrinketTests/**', 'TrinketUITests/**', 'Packages/**', 'ContentManifest/**', 'project.yml', 'Package.resolved', '*.xctestplan') }}
          restore-keys: |
            build-

      - name: Build for testing
        run: ./Scripts/build-for-testing.sh
        env:
          SKIP_GENERATE: 1

      - name: Save build cache for test jobs
        uses: actions/cache/save@v4
        with:
          path: .DerivedData
          key: ${{ steps.export-build-cache-key.outputs.key }}

  unit:
    name: Unit tests - ${{ matrix.target }}
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [app, TrinketCore, TrinketContent, BattleEngine, TrinketPersistence, TrinketDesignSystem]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          cache-key: ${{ needs.build.outputs.build-cache-key }}
          artifact-name: pr-unit-${{ matrix.target }}
          command: |
            if [ "${{ matrix.target }}" = "app" ]; then
              ./Scripts/test.sh unit TrinketTests --no-build --verbose
            else
              ./Scripts/test-package.sh ${{ matrix.target }} --no-build --verbose
            fi

  smoke:
    name: Smoke UI tests
    needs: build
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          cache-key: ${{ needs.build.outputs.build-cache-key }}
          artifact-name: pr-smoke
          command: ./Scripts/test.sh smoke-full --no-build --verbose
          timing-mode: smoke-full
          timing-budget-seconds: '360'
