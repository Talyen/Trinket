name: Trinket PR

on:
  pull_request:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Generate and style
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - run: ./Scripts/generate.sh
      - run: ./Scripts/assert-generated-output.sh
      - run: ./Scripts/test.sh style
      - run: ./Scripts/check-module-boundaries.sh
      - run: ./Scripts/release-notes.sh validate

  unit:
    name: Unit tests
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - run: ./Scripts/test.sh unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-unit-results-${{ github.run_id }}
          path: .DerivedData/TestResults/
          if-no-files-found: ignore

  smoke:
    name: Smoke UI tests
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - run: ./Scripts/test.sh smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-smoke-results-${{ github.run_id }}
          path: .DerivedData/TestResults/
          if-no-files-found: ignore
