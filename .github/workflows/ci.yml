name: Trinket CI
run-name: ${{ inputs.scope == 'qualification' && 'Native qualification' || 'Trinket CI' }} (${{ github.event_name == 'schedule' && 'latest' || inputs.toolchain || 'verified' }})

on:
  push:
    branches: [main]
  schedule:
    # Nightly exhaustive catches deep journeys off the push path.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      toolchain:
        description: Xcode verification channel
        required: true
        type: choice
        default: verified
        options:
          - verified
          - latest
      scope:
        description: Test scope
        required: true
        type: choice
        default: standard
        options:
          - standard
          - exhaustive
          - exhaustive-pilot
          - qualification

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Manual/nightly runs wait behind a push without occupying a runner. New pushes
  # still supersede obsolete verification for this branch.
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  actions: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      xcode-channel: ${{ github.event_name == 'schedule' && 'latest' || inputs.toolchain || 'verified' }}
      force-full: ${{ inputs.scope == 'exhaustive-pilot' }}
      qualify-native: ${{ inputs.scope == 'qualification' }}
      include-exhaustive: ${{ github.event_name == 'schedule' || inputs.scope == 'exhaustive' || inputs.scope == 'exhaustive-pilot' }}
