name: Trinket CI

# Automatic CI is paused until GitHub Actions budget is available.
# Re-enable pull_request and push triggers below when ready.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Test scope (standard, exhaustive)'
        required: true
        default: 'standard'

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Install tooling
        run: |
          brew install xcodegen swiftlint@0.65 swiftformat

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .DerivedData
          key: deriveddata-${{ runner.os }}-xcode-26-${{ hashFiles('**/*.swift', 'project.yml', 'Unit.xctestplan', 'Smoke.xctestplan', 'FullUI.xctestplan', 'Integration.xctestplan') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-xcode-26-

      - name: Generate project
        run: ./Scripts/generate.sh

      - name: Style check
        run: ./Scripts/test.sh style

      - name: Unit tests
        run: ./Scripts/test.sh unit

      - name: UI smoke tests
        run: ./Scripts/test.sh smoke

      - name: Sync coordinator tests
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'exhaustive' || github.ref_name == 'main'
        run: ./Scripts/test.sh --no-build unit PlayerSaveSyncCoordinatorTests

      - name: Full UI tests
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'exhaustive' || github.ref_name == 'main'
        run: ./Scripts/test.sh --no-build ui

      - name: Upload timing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timing
          path: .DerivedData/TestResults/timing-log.jsonl
          if-no-files-found: ignore
