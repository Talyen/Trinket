name: Trinket CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Test scope (standard, exhaustive)'
        required: true
        default: 'standard'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Generate and style
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-trinket

      - name: Generate project
        run: ./Scripts/generate.sh

      - name: Assert generated output is committed
        run: ./Scripts/assert-generated-output.sh

      - name: Style check
        run: ./Scripts/test.sh style

      - name: Module boundary check
        run: ./Scripts/check-module-boundaries.sh

      - name: Validate release notes config
        run: ./Scripts/release-notes.sh validate

  balance-gate:
    name: Balance gate
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-trinket

      - name: Run CI balance gate sweep
        run: ./Scripts/assert-balance-gate.sh

      - name: Upload balance gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-gate-report-${{ github.run_id }}
          path: .DerivedData/BalanceReports/ci-gate.*
          if-no-files-found: ignore

  build:
    name: Build for testing
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-trinket
        with:
          restore-derived-data: 'true'

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept 2>/dev/null || true

      - name: Install iOS Simulator runtime
        run: |
          if ! xcrun simctl runtime list 2>/dev/null | grep -q "^iOS "; then
            echo "No iOS Simulator runtime found; downloading..."
            timeout 300 xcodebuild -downloadPlatform iOS || timeout 300 xcodebuild -downloadAllPlatforms
          fi

      - name: Build for testing
        run: ./Scripts/build-for-testing.sh

      - name: Save DerivedData
        uses: actions/cache/save@v4
        with:
          path: .DerivedData
          key: deriveddata-${{ runner.os }}-xcode-26-${{ hashFiles('**/*.swift', 'project.yml', 'Unit.xctestplan', 'Smoke.xctestplan', 'FullUI.xctestplan', 'Integration.xctestplan') }}

  unit:
    name: Unit tests
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-trinket
        with:
          restore-derived-data: 'true'

      - name: Generate project
        run: ./Scripts/generate.sh

      - name: Unit tests
        run: ./Scripts/test.sh --no-build unit

      - name: Assert unit timing budget
        if: success()
        run: ./Scripts/test-timing.sh assert-budget --mode unit --max-wall 300

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-unit-${{ github.run_id }}
          path: .DerivedData/TestResults/*.xcresult
          if-no-files-found: ignore

      - name: Upload timing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timing-unit
          path: .DerivedData/TestResults/timing-log.jsonl
          if-no-files-found: ignore

  ui:
    name: UI tests
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-trinket
        with:
          restore-derived-data: 'true'

      - name: Generate project
        run: ./Scripts/generate.sh

      - name: UI smoke tests
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.scope != 'exhaustive')
        run: ./Scripts/test.sh --no-build smoke

      - name: Assert smoke timing budget
        if: success() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.scope != 'exhaustive'))
        run: ./Scripts/test-timing.sh assert-budget --mode smoke --max-wall 360

      - name: Full UI tests
        if: (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'exhaustive')
        run: ./Scripts/test.sh --no-build ui

      - name: Assert UI timing budget
        if: success() && ((github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'exhaustive'))
        run: ./Scripts/test-timing.sh assert-budget --mode ui --max-wall 720

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-ui-${{ github.run_id }}
          path: .DerivedData/TestResults/*.xcresult
          if-no-files-found: ignore

      - name: Upload timing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timing-ui
          path: .DerivedData/TestResults/timing-log.jsonl
          if-no-files-found: ignore
