name: Trinket CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Test scope (standard, exhaustive)'
        required: true
        default: 'standard'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Generate and style
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/Cellar/swiftlint
            /opt/homebrew/Cellar/swiftformat
          key: brew-${{ runner.os }}-xcodegen-swiftlint-swiftformat-1
          restore-keys: |
            brew-${{ runner.os }}-xcodegen-swiftlint-swiftformat-

      - name: Install tooling
        run: brew install xcodegen swiftlint swiftformat

      - name: Generate project
        run: ./Scripts/generate.sh

      - name: Assert generated output is committed
        run: ./Scripts/assert-generated-output.sh

      - name: Style check
        run: ./Scripts/test.sh style

  build:
    name: Build for testing
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/Cellar/swiftlint
            /opt/homebrew/Cellar/swiftformat
          key: brew-${{ runner.os }}-xcodegen-swiftlint-swiftformat-1
          restore-keys: |
            brew-${{ runner.os }}-xcodegen-swiftlint-swiftformat-

      - name: Install tooling
        run: brew install xcodegen swiftlint swiftformat

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .DerivedData
          key: deriveddata-${{ runner.os }}-xcode-26-${{ hashFiles('**/*.swift', 'project.yml', 'Unit.xctestplan', 'Smoke.xctestplan', 'FullUI.xctestplan', 'Integration.xctestplan') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-xcode-26-

      - name: Build for testing
        run: ./Scripts/build-for-testing.sh

  unit:
    name: Unit tests
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/Cellar/swiftlint
            /opt/homebrew/Cellar/swiftformat
          key: brew-${{ runner.os }}-xcodegen-swiftlint-swiftformat-1
          restore-keys: |
            brew-${{ runner.os }}-xcodegen-swiftlint-swiftformat-

      - name: Install tooling
        run: brew install xcodegen swiftlint swiftformat

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .DerivedData
          key: deriveddata-${{ runner.os }}-xcode-26-${{ hashFiles('**/*.swift', 'project.yml', 'Unit.xctestplan', 'Smoke.xctestplan', 'FullUI.xctestplan', 'Integration.xctestplan') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-xcode-26-

      - name: Unit tests
        env:
          SKIP_GENERATE: 1
        run: ./Scripts/test.sh --no-build unit

      - name: Assert unit timing budget
        if: success()
        run: ./Scripts/test-timing.sh assert-budget --mode unit --max-wall 300

      - name: Upload timing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timing-unit
          path: .DerivedData/TestResults/timing-log.jsonl
          if-no-files-found: ignore

  ui:
    name: UI tests
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/Cellar/swiftlint
            /opt/homebrew/Cellar/swiftformat
          key: brew-${{ runner.os }}-xcodegen-swiftlint-swiftformat-1
          restore-keys: |
            brew-${{ runner.os }}-xcodegen-swiftlint-swiftformat-

      - name: Install tooling
        run: brew install xcodegen swiftlint swiftformat

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .DerivedData
          key: deriveddata-${{ runner.os }}-xcode-26-${{ hashFiles('**/*.swift', 'project.yml', 'Unit.xctestplan', 'Smoke.xctestplan', 'FullUI.xctestplan', 'Integration.xctestplan') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-xcode-26-

      - name: UI smoke tests
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.scope != 'exhaustive')
        env:
          SKIP_GENERATE: 1
        run: ./Scripts/test.sh --no-build smoke

      - name: Assert smoke timing budget
        if: success() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.scope != 'exhaustive'))
        run: ./Scripts/test-timing.sh assert-budget --mode smoke --max-wall 360

      - name: Full UI tests
        if: (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'exhaustive')
        env:
          SKIP_GENERATE: 1
        run: ./Scripts/test.sh --no-build ui

      - name: Assert UI timing budget
        if: success() && ((github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'exhaustive'))
        run: ./Scripts/test-timing.sh assert-budget --mode ui --max-wall 720

      - name: Upload timing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timing-ui
          path: .DerivedData/TestResults/timing-log.jsonl
          if-no-files-found: ignore
