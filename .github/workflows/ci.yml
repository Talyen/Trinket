name: Trinket CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Test scope
        required: true
        type: choice
        default: standard
        options:
          - standard
          - exhaustive

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      include-exhaustive: ${{ github.event_name == 'push' || inputs.scope == 'exhaustive' }}
