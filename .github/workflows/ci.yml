name: Trinket CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: 'Test scope (standard, exhaustive)'
        required: true
        default: 'standard'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  gate:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/gate.yml

  assets-gate:
    name: Asset codegen
    needs: [changes, gate]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.assets == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      - run: ./Scripts/generate.sh --assets
      - run: ./Scripts/assert-generated-output.sh --assets

  verify:
    name: Build, unit, and smoke tests
    needs: [changes, gate]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      - name: Build all test bundles
        run: ./Scripts/build-for-testing.sh
        env:
          SKIP_GENERATE: 1
      - name: Run unit and smoke suites
        shell: bash
        env:
          SKIP_GENERATE: 1
          CI: true
        run: |
          status=0
          ./Scripts/test.sh unit --no-build --verbose || status=1
          ./Scripts/test.sh smoke-full --no-build --verbose || status=1
          exit "$status"
      - name: Classify CI outcome and report timing
        if: always()
        run: ./Scripts/ci-diagnostics.sh .DerivedData/TestResults
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verify-${{ github.run_id }}
          path: .DerivedData/TestResults/
          if-no-files-found: ignore

  exhaustive-ui:
    name: Exhaustive UI tests
    needs: [changes, gate]
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'exhaustive'))
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      - name: Build all test bundles
        run: ./Scripts/build-for-testing.sh
        env:
          SKIP_GENERATE: 1
      - name: Run exhaustive UI suite
        run: ./Scripts/test.sh ui --no-build --verbose
        env:
          SKIP_GENERATE: 1
          CI: true
      - name: Classify CI outcome and report timing
        if: always()
        run: ./Scripts/ci-diagnostics.sh .DerivedData/TestResults
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: exhaustive-ui-${{ github.run_id }}
          path: .DerivedData/TestResults/
          if-no-files-found: ignore
