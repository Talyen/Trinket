name: Trinket CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: 'Test scope (standard, exhaustive)'
        required: true
        default: 'standard'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  gate:
    uses: ./.github/workflows/gate.yml

  assets-gate:
    name: Asset codegen
    needs: [gate, changes]
    if: needs.changes.outputs.assets == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - run: ./Scripts/generate.sh --assets
      - run: ./Scripts/assert-generated-output.sh --assets

  build:
    name: Build for testing
    needs: gate
    runs-on: macos-26
    timeout-minutes: 25
    outputs:
      build-cache-key: ${{ steps.save-build-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket

      - name: Restore warm build cache
        uses: actions/cache/restore@v4
        with:
          path: .DerivedData
          key: build-${{ hashFiles('Trinket/**', 'TrinketTests/**', 'TrinketUITests/**', 'Packages/**', 'ContentManifest/**', 'project.yml', 'Package.resolved', '*.xctestplan') }}
          restore-keys: |
            build-

      - name: Build for testing
        run: ./Scripts/build-for-testing.sh
        env:
          SKIP_GENERATE: 1

      - name: Save build cache for test jobs
        id: save-build-cache
        uses: actions/cache/save@v4
        with:
          path: .DerivedData
          key: build-${{ github.run_id }}-${{ hashFiles('Trinket/**', 'TrinketTests/**', 'TrinketUITests/**', 'Packages/**', 'ContentManifest/**', 'project.yml', 'Package.resolved', '*.xctestplan') }}

  unit:
    name: Unit tests - ${{ matrix.target }}
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [app, TrinketCore, TrinketContent, BattleEngine, TrinketPersistence, TrinketDesignSystem]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          cache-key: ${{ needs.build.outputs.build-cache-key }}
          artifact-name: unit-${{ matrix.target }}
          command: |
            if [ "${{ matrix.target }}" = "app" ]; then
              ./Scripts/test.sh unit TrinketTests --no-build --verbose
            else
              ./Scripts/test-package.sh ${{ matrix.target }} --no-build --verbose
            fi

  ui-smoke:
    name: UI tests - smoke
    needs: build
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          cache-key: ${{ needs.build.outputs.build-cache-key }}
          artifact-name: ui-smoke
          command: ./Scripts/test.sh smoke --no-build --verbose
          timing-mode: smoke
          timing-budget-seconds: '360'

  ui-exhaustive:
    name: UI tests - ${{ matrix.shard }}
    needs: build
    runs-on: macos-26
    timeout-minutes: 25
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'exhaustive')
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: exhaustive-battle
            command: ./Scripts/test.sh ui BattleFlowUITests --no-build --verbose
          - shard: exhaustive-collection
            command: ./Scripts/test.sh ui TabNavigationUITests SearchUITests --no-build --verbose
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          cache-key: ${{ needs.build.outputs.build-cache-key }}
          artifact-name: ui-${{ matrix.shard }}
          command: ${{ matrix.command }}
