name: Trinket CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: 'Test scope (standard, exhaustive)'
        required: true
        default: 'standard'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Generate and style
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket
      - run: ./Scripts/generate.sh
      - run: ./Scripts/assert-generated-output.sh
      - run: ./Scripts/test.sh style
      - run: ./Scripts/check-module-boundaries.sh
      - run: ./Scripts/release-notes.sh validate

  unit:
    name: Unit tests - ${{ matrix.target }}
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      SKIP_GENERATE: 1
    strategy:
      fail-fast: false
      matrix:
        target: [app, TrinketCore, TrinketContent, BattleEngine, TrinketPersistence, TrinketDesignSystem]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .DerivedData
          key: deriveddata-unit-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/*.swift', 'project.yml', 'Package.resolved') }}
          restore-keys: |
            deriveddata-unit-${{ runner.os }}-${{ matrix.target }}-

      - name: Run unit tests
        run: |
          if [ "${{ matrix.target }}" = "app" ]; then
            ./Scripts/test.sh unit TrinketTests --verbose
          else
            ./Scripts/test-package.sh ${{ matrix.target }} --verbose
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ matrix.target }}-${{ github.run_id }}
          path: .DerivedData/TestResults/
          if-no-files-found: ignore

      - name: Clean test results before caching
        if: always()
        run: rm -rf .DerivedData/TestResults/*.xcresult

  ui-smoke:
    name: UI tests - smoke
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      SKIP_GENERATE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .DerivedData
          key: deriveddata-ui-${{ runner.os }}-smoke-${{ hashFiles('**/*.swift', 'project.yml', 'Package.resolved') }}
          restore-keys: |
            deriveddata-ui-${{ runner.os }}-smoke-

      - name: Run UI tests
        run: ./Scripts/test.sh smoke --verbose

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results-smoke-${{ github.run_id }}
          path: .DerivedData/TestResults/
          if-no-files-found: ignore

      - name: Clean test results before caching
        if: always()
        run: rm -rf .DerivedData/TestResults/*.xcresult

  ui-exhaustive:
    name: UI tests - ${{ matrix.shard }}
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 25
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'exhaustive')
    env:
      SKIP_GENERATE: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 'exhaustive-battle'
            command: 'ui BattleFlowUITests'
          - shard: 'exhaustive-collection'
            command: 'ui TabNavigationUITests SearchUITests'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-trinket

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .DerivedData
          key: deriveddata-ui-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('**/*.swift', 'project.yml', 'Package.resolved') }}
          restore-keys: |
            deriveddata-ui-${{ runner.os }}-${{ matrix.shard }}-

      - name: Run UI tests
        run: ./Scripts/test.sh ${{ matrix.command }} --verbose

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results-${{ matrix.shard }}-${{ github.run_id }}
          path: .DerivedData/TestResults/
          if-no-files-found: ignore

      - name: Clean test results before caching
        if: always()
        run: rm -rf .DerivedData/TestResults/*.xcresult
