name: Player coverage

on:
  schedule:
    - cron: '0 8 * * 1-6'
    - cron: '0 8 * * 0'
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      scope:
        description: Coverage portfolio
        type: choice
        default: profiles
        options: [profiles, soak, all]

permissions:
  contents: read
  actions: read

concurrency:
  group: player-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profiles:
    name: Critical controls (${{ matrix.profile }})
    if: (github.event_name == 'schedule' && github.event.schedule != '0 9 * * 0') || inputs.scope == 'profiles' || inputs.scope == 'all'
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [compact, tablet26, tablet, duo]
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/.DerivedData
      TRINKET_DIAGNOSTICS_SESSION_ID: player-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
      TRINKET_CLEANUP_TEST_ARTIFACTS: '0'
      TRINKET_REQUIRED_PURCHASE: '1'
      TEST_RUNNER_TRINKET_REQUIRED_PURCHASE: '1'
    steps:
      - name: Reserve diagnostic time
        shell: bash
        run: echo "TRINKET_CI_DEADLINE_EPOCH=$(( $(date +%s) + 120 * 60 - 180 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: ./.github/actions/setup-trinket
        with:
          metal: 'true'
          xcode-channel: verified
      - uses: ./.github/actions/coverage-products
      - name: Prepare requested profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: python3 Scripts/ci-run-budget.py --phase player-profile-prerequisite -- python3 Scripts/coverage_profiles.py prepare --name "$PROFILE"
      - name: Run requested profile
        env:
          PROFILE: ${{ matrix.profile }}
          TRINKET_COVERAGE_NO_BUILD: '1'
          TRINKET_COVERAGE_AUDIT_POLICY: ${{ github.event.schedule == '0 8 * * 1-6' && 'representative' || 'all' }}
        run: python3 Scripts/ci-run-budget.py --phase player-profile -- ./Scripts/player-coverage.sh "$PROFILE"
      - name: Stage bounded profile evidence
        if: always()
        run: python3 Scripts/coverage_profiles.py stage --results .DerivedData/TestResults --output .DerivedData/ProfileDiagnostics
      - name: Retain profile results and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-profiles-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .DerivedData/PlayerCoverage
            .DerivedData/ProfileDiagnostics
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  soak:
    name: Weekly repeated play and crash recovery
    if: github.event.schedule == '0 9 * * 0' || inputs.scope == 'soak' || inputs.scope == 'all'
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/.DerivedData
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: ./.github/actions/setup-trinket
        with:
          metal: 'true'
          xcode-channel: verified
      - uses: ./.github/actions/coverage-products
      - name: Serial soak, twenty careers, and interrupted settlement recovery
        env:
          TRINKET_COVERAGE_NO_BUILD: '1'
        run: ./Scripts/player-coverage.sh soak
      - name: Retain raw stores, journals, reports and result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .DerivedData/PlayerCoverage
            .DerivedData/TestResults
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  coverage-status:
    name: Player coverage status (advisory for pushes)
    needs: [profiles, soak]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          sparse-checkout: Scripts
      - name: Report actual requested-job conclusions
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          PROFILES_REQUESTED: ${{ (github.event_name == 'schedule' && github.event.schedule != '0 9 * * 0') || inputs.scope == 'profiles' || inputs.scope == 'all' }}
          SOAK_REQUESTED: ${{ github.event.schedule == '0 9 * * 0' || inputs.scope == 'soak' || inputs.scope == 'all' }}
        shell: bash
        run: |
          required=()
          if [[ "$PROFILES_REQUESTED" == true ]]; then required+=(profiles); fi
          if [[ "$SOAK_REQUESTED" == true ]]; then required+=(soak); fi
          python3 Scripts/report-ci-status.py --title 'Player coverage (advisory for pushes)' --require "${required[@]}"
