name: Player coverage

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      scope:
        description: Coverage portfolio
        type: choice
        default: profiles
        options: [profiles, compatibility, soak, all]

permissions:
  contents: read
  actions: read

concurrency:
  group: player-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios18-runtime:
    name: Export Apple's iOS 18 runtime
    if: github.event.schedule == '0 8 * * *' || inputs.scope == 'compatibility' || inputs.scope == 'all'
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      # Xcode 27's CLI rejects pre-26 downloads (FB24836279). Export with
      # Xcode 26, then import on the verified build/test runner below.
      - name: Export the iOS 18.0 simulator runtime
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          sudo xcodebuild -runFirstLaunch
          xcrun simctl list runtimes available
          xcodebuild -downloadPlatform iOS -buildVersion 18.0 -exportPath "$RUNNER_TEMP/ios18-runtime"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios18-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios18-runtime/**/*.dmg
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  compatibility:
    name: iOS 18 compatibility, purchases and durable saves
    needs: ios18-runtime
    if: github.event.schedule == '0 8 * * *' || inputs.scope == 'compatibility' || inputs.scope == 'all'
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/.DerivedData
      TRINKET_DIAGNOSTICS_SESSION_ID: ios18-${{ github.run_id }}-${{ github.run_attempt }}
      TRINKET_CLEANUP_TEST_ARTIFACTS: '0'
      TRINKET_SIM_OS_MAJOR: '18'
      TRINKET_SIM_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: ./.github/actions/setup-trinket
        with:
          metal: 'true'
          xcode-channel: verified
      - name: Make room for the required runtime on the disposable runner
        run: |
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          xcrun simctl runtime delete all
          df -h /
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ios18-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios18-runtime
      - name: Import and validate the required iOS 18 runtime
        timeout-minutes: 35
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          archives = list((Path(os.environ['RUNNER_TEMP']) / 'ios18-runtime').rglob('*.dmg'))
          if len(archives) != 1:
              raise SystemExit(f'Expected one Apple runtime archive, found {len(archives)}')
          subprocess.run(['xcodebuild', '-importPlatform', str(archives[0])], check=True, timeout=1800)
          archives[0].unlink()
          PY
          python3 Scripts/coverage_profiles.py prepare --name ios18
      - uses: ./.github/actions/coverage-products
      - name: Verify fallback controls, smoke, purchase recovery and persistence serially
        env:
          TRINKET_COVERAGE_NO_BUILD: '1'
        run: ./Scripts/player-coverage.sh ios18
      - name: Stage compatibility evidence
        if: always()
        run: python3 Scripts/coverage_profiles.py stage --results .DerivedData/TestResults --output .DerivedData/CompatibilityDiagnostics
      - name: Retain compatibility results and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios18-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .DerivedData/PlayerCoverage
            .DerivedData/CompatibilityDiagnostics
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  profiles:
    name: Critical controls on compact phone, iPad and Duo
    if: github.event.schedule == '0 8 * * *' || inputs.scope == 'profiles' || inputs.scope == 'all'
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/.DerivedData
      TRINKET_DIAGNOSTICS_SESSION_ID: player-profiles-${{ github.run_id }}-${{ github.run_attempt }}
      TRINKET_CLEANUP_TEST_ARTIFACTS: '0'
      TRINKET_REQUIRED_PURCHASE: '1'
      TEST_RUNNER_TRINKET_REQUIRED_PURCHASE: '1'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: ./.github/actions/setup-trinket
        with:
          metal: 'true'
          xcode-channel: verified
      - uses: ./.github/actions/coverage-products
      - name: Run requested profiles serially
        env:
          TRINKET_COVERAGE_NO_BUILD: '1'
        shell: bash
        run: |
          status=0
          for profile in compact tablet duo; do
            if python3 Scripts/coverage_profiles.py prepare --name "$profile"; then
              ./Scripts/player-coverage.sh "$profile" || status=1
            else
              echo "::error::$profile simulator prerequisite unavailable; continuing independent profiles."
              echo "$profile: simulator prerequisite unavailable" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          done
          exit "$status"
      - name: Stage bounded profile evidence
        if: always()
        run: python3 Scripts/coverage_profiles.py stage --results .DerivedData/TestResults --output .DerivedData/ProfileDiagnostics
      - name: Retain profile results and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-profiles-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .DerivedData/PlayerCoverage
            .DerivedData/ProfileDiagnostics
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  soak:
    name: Weekly repeated play and crash recovery
    if: github.event.schedule == '0 9 * * 0' || inputs.scope == 'soak' || inputs.scope == 'all'
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/.DerivedData
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: ./.github/actions/setup-trinket
        with:
          metal: 'true'
          xcode-channel: verified
      - uses: ./.github/actions/coverage-products
      - name: Serial soak, twenty careers, and interrupted settlement recovery
        env:
          TRINKET_COVERAGE_NO_BUILD: '1'
        run: ./Scripts/player-coverage.sh soak
      - name: Retain raw stores, journals, reports and result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: player-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .DerivedData/PlayerCoverage
            .DerivedData/TestResults
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  coverage-status:
    name: Player coverage status (advisory for pushes)
    needs: [ios18-runtime, compatibility, profiles, soak]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report actual requested-job conclusions
        env:
          IOS18_RUNTIME: ${{ needs.ios18-runtime.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          PROFILES: ${{ needs.profiles.result }}
          SOAK: ${{ needs.soak.result }}
        shell: bash
        run: |
          printf 'iOS 18 runtime: %s\niOS 18: %s\nProfiles: %s\nSoak: %s\n' "$IOS18_RUNTIME" "$COMPATIBILITY" "$PROFILES" "$SOAK" >> "$GITHUB_STEP_SUMMARY"
          for result in "$IOS18_RUNTIME" "$COMPATIBILITY" "$PROFILES" "$SOAK"; do
            [[ "$result" == success || "$result" == skipped ]] || exit 1
          done
