name: Player coverage

on:
  schedule:
    - cron: '0 8 * * 1-6'
    - cron: '0 8 * * 0'
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      scope:
        description: Coverage portfolio
        type: choice
        default: profiles
        options: [profiles, soak, all, rotation]
      toolchain:
        description: Xcode channel for the requested coverage
        type: choice
        default: verified
        options: [verified, latest]

permissions:
  contents: read
  actions: read

concurrency:
  group: player-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: (github.event_name == 'schedule' && github.event.schedule != '0 9 * * 0') || inputs.scope == 'profiles' || inputs.scope == 'all' || inputs.scope == 'rotation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          sparse-checkout: Scripts
      - id: matrix
        env:
          COVERAGE_SCOPE: ${{ inputs.scope || 'profiles' }}
        run: python3 Scripts/coverage_profiles.py matrix --scope "$COVERAGE_SCOPE" >> "$GITHUB_OUTPUT"

  profiles:
    needs: plan
    name: ${{ matrix.check }} (${{ matrix.profile }})
    if: (github.event_name == 'schedule' && github.event.schedule != '0 9 * * 0') || inputs.scope == 'profiles' || inputs.scope == 'all' || inputs.scope == 'rotation'
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix || '{"include":[{"profile":"compact","check":"profiles"}]}') }}
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/.DerivedData
      TRINKET_DIAGNOSTICS_SESSION_ID: player-${{ matrix.check }}-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
      TRINKET_CLEANUP_TEST_ARTIFACTS: '0'
      TRINKET_REQUIRED_PURCHASE: '1'
      TEST_RUNNER_TRINKET_REQUIRED_PURCHASE: '1'
    steps:
      - name: Reserve diagnostic time
        shell: bash
        run: echo "TRINKET_CI_DEADLINE_EPOCH=$(( $(date +%s) + 120 * 60 - 180 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        id: checkout
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '1024'
          GIT_HTTP_LOW_SPEED_TIME: '60'
        with:
          # Test products use committed resources. The raw asset library is outside this cone.
          sparse-checkout: |
            Scripts
            Packages
            Trinket
            TrinketUITests
            Trinket.xcodeproj
            StoreKit
            ContentManifest
            Localization
            ArtManifest
            MusicManifest
            SoundManifest
            .github
      - uses: ./.github/actions/setup-trinket
        with:
          metal: 'true'
          xcode-channel: ${{ inputs.toolchain || 'verified' }}
      - uses: ./.github/actions/coverage-products
      - name: Prepare requested profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: python3 Scripts/ci-test-capability.py --scope "prepare-$PROFILE" -- python3 Scripts/coverage_profiles.py prepare --name "$PROFILE"
      - name: Run requested check
        env:
          PROFILE: ${{ matrix.profile }}
          COVERAGE_CHECK: ${{ matrix.check }}
          TRINKET_XCODE_WALL_TIMEOUT_SECONDS: ${{ matrix.check == 'reward-return' && '300' || '' }}
          TRINKET_COVERAGE_NO_BUILD: '1'
          TRINKET_COVERAGE_AUDIT_POLICY: ${{ github.event.schedule == '0 8 * * 1-6' && 'representative' || 'all' }}
        run: python3 Scripts/ci-test-capability.py --scope "$PROFILE-$COVERAGE_CHECK" --requires-simulator -- ./Scripts/player-coverage.sh "$PROFILE" "$COVERAGE_CHECK"
      - name: Stage bounded profile evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 Scripts/coverage_profiles.py stage --results .DerivedData/TestResults --output .DerivedData/ProfileDiagnostics
      - name: Retain profile results and failures
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: ./.github/actions/player-evidence
        with:
          name: player-${{ matrix.check }}-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .DerivedData/PlayerCoverage
            .DerivedData/ProfileDiagnostics
            .DerivedData/CICoverage

  soak:
    name: Weekly repeated play and crash recovery
    if: github.event.schedule == '0 9 * * 0' || inputs.scope == 'soak' || inputs.scope == 'all'
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/.DerivedData
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        id: checkout
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '1024'
          GIT_HTTP_LOW_SPEED_TIME: '60'
        with:
          # Test products use committed resources. The raw asset library is outside this cone.
          sparse-checkout: |
            Scripts
            Packages
            Trinket
            TrinketUITests
            Trinket.xcodeproj
            StoreKit
            ContentManifest
            Localization
            ArtManifest
            MusicManifest
            SoundManifest
            .github
      - uses: ./.github/actions/setup-trinket
        with:
          metal: 'true'
          xcode-channel: ${{ inputs.toolchain || 'verified' }}
      - uses: ./.github/actions/coverage-products
      - uses: ./.github/actions/setup-functional-ui
      - name: Serial soak, twenty careers, and interrupted settlement recovery
        env:
          TRINKET_COVERAGE_NO_BUILD: '1'
        run: python3 Scripts/ci-test-capability.py --scope soak --requires-simulator -- ./Scripts/player-coverage.sh soak
      - name: Retain raw stores, journals, reports and result bundles
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: ./.github/actions/player-evidence
        with:
          name: player-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .DerivedData/PlayerCoverage
            .DerivedData/TestResults
            .DerivedData/CICoverage

  coverage-status:
    name: Player coverage status (advisory for pushes)
    needs: [profiles, soak]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          sparse-checkout: Scripts
      - name: Report actual requested-job conclusions
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          PROFILES_REQUESTED: ${{ (github.event_name == 'schedule' && github.event.schedule != '0 9 * * 0') || inputs.scope == 'profiles' || inputs.scope == 'all' || inputs.scope == 'rotation' }}
          SOAK_REQUESTED: ${{ github.event.schedule == '0 9 * * 0' || inputs.scope == 'soak' || inputs.scope == 'all' }}
        shell: bash
        run: |
          required=()
          if [[ "$PROFILES_REQUESTED" == true ]]; then required+=(profiles); fi
          if [[ "$SOAK_REQUESTED" == true ]]; then required+=(soak); fi
          python3 Scripts/report-ci-status.py --title 'Player coverage (advisory for pushes)' --require "${required[@]}"
