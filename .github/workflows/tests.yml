name: Build and test

# Shared build-once test fan-out used by ci.yml.
# Gate, app-only build, and package unit run in parallel after the path filter.
# Lint/CI-glue Scripts and workflows are infra-only (generate/style, no macos
# app/UI). Build/test/generate Scripts still classify as product code so macos
# jobs run. Smoke is sharded; exhaustive UI is sharded by feature and is
# advisory (nightly/scheduled or workflow_dispatch exhaustive), not a push
# blocker — smoke + unit gate pushes. The build artifact is Products + stamps,
# not the full DerivedData tree. Test jobs sparse-checkout without Raw Assets
# (and assert project.yml / *.xctestplan). Warm DerivedData: primary key
# build-<nonsource>-<full>; restore-keys build-<nonsource>- for same
# toolchain/assets incremental source rebuilds (script-only edits keep that
# prefix). Within-run fan-out uses a run-scoped artifact of pruned
# .DerivedData. The build job compiles the app so smoke and exhaustive UI can
# run with --no-build; the unit job compiles package schemes itself. Advisory
# SwiftLint analyze runs beside tests from the app-only compiler log, not on
# the build job. The exhaustive UI suite is sharded by feature so post-push
# validation does not serialize every journey on one CI simulator.

on:
  workflow_call:
    inputs:
      include-exhaustive:
        description: Also run the sharded exhaustive UI suite
        required: false
        type: boolean
        default: false
      artifact-prefix:
        description: Prefix for uploaded test-result artifact names
        required: false
        type: string
        default: ''

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  gate:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' || needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/gate.yml

  assets-gate:
    name: Asset codegen
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.assets == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      # Same semantics as local ./Scripts/ci-assets-gate.sh (single owner).
      - name: Asset codegen gate
        run: ./Scripts/ci-assets-gate.sh

  build:
    name: Build for testing
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      build-artifact: ${{ steps.restore-and-build.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          # Cone mode keeps root files (project.yml, *.xctestplan). Skip Raw Assets.
          sparse-checkout: |
            Scripts
            Packages
            Trinket
            TrinketUITests
            Trinket.xcodeproj
            ContentManifest
            ArtManifest
            MusicManifest
            SoundManifest
            CinematicManifest
            .github
      - name: Assert sparse checkout kept root build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f project.yml
          test -f Smoke.xctestplan
          test -f FullUI.xctestplan
          test -f BattlePerformance.xctestplan
      - uses: ./.github/actions/setup-trinket
      - name: Restore warm cache and build
        id: restore-and-build
        uses: ./.github/actions/restore-and-build
        with:
          artifact-prefix: ${{ inputs.artifact-prefix }}
          build-command: ./Scripts/build-for-testing.sh --app-only
          prune: 'true'
          save-cache: 'true'
          upload-artifact: 'true'
      - name: Upload compiler logs for analyze
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.restore-and-build.outputs.artifact-name }}-compiler-logs
          path: .DerivedData/TestResults/raw
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  unit:
    name: Unit tests (${{ matrix.name }})
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Heavy
            packages: BattleEngine
          - name: Rest
            packages: TrinketCore TrinketContent TrinketPersistence TrinketDesignSystem TrinketFeatureSupport TrinketBattleFeature TrinketAppState
    runs-on: macos-26
    # Package schemes are compiled in this job; the shared build is app-only
    # so smoke/UI can start without waiting on package test products.
    # Sharded 2-way (Heavy vs Rest) so BattleEngine no longer serializes all 8 packages.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            Scripts
            Packages
            Trinket
            TrinketUITests
            Trinket.xcodeproj
            ContentManifest
            ArtManifest
            MusicManifest
            SoundManifest
            CinematicManifest
            .github
      - name: Assert sparse checkout kept root build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f project.yml
          test -f Smoke.xctestplan
          test -f FullUI.xctestplan
          test -f BattlePerformance.xctestplan
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/restore-and-build
        with:
          skip-build: 'true'
      - uses: ./.github/actions/test-job
        with:
          artifact-name: ${{ inputs.artifact-prefix }}unit-${{ matrix.name }}
          command: ./Scripts/test-package.sh ${{ matrix.packages }}
          preboot-simulator: 'true'

  smoke:
    name: Smoke tests (${{ matrix.name }})
    needs: [changes, build]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Shell
            target: SmokeShellTests StarterOnboardingSmokeTests
          - name: Play
            target: SmokeBattleTests SmokeShopTests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            Scripts
            Packages
            Trinket
            TrinketUITests
            Trinket.xcodeproj
            ContentManifest
            ArtManifest
            MusicManifest
            SoundManifest
            CinematicManifest
            .github
      - name: Assert sparse checkout kept root build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f project.yml
          test -f Smoke.xctestplan
          test -f FullUI.xctestplan
          test -f BattlePerformance.xctestplan
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          build-artifact: ${{ needs.build.outputs.build-artifact }}
          artifact-name: ${{ inputs.artifact-prefix }}smoke-${{ matrix.name }}
          rebuild-command: ./Scripts/build-for-testing.sh --app-only
          command: ./Scripts/test.sh smoke --no-build ${{ matrix.target }}
          preboot-simulator: 'true'

  exhaustive-ui:
    name: Exhaustive UI (${{ matrix.name }})
    needs: [changes, build]
    if: >-
      inputs.include-exhaustive &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.changes.outputs.code == 'true')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Battle
            target: BattleFlowUITests
          - name: Collection
            target: TabNavigationUITests HeroDetailAbilityPickerUITests
          - name: Homestead
            target: HomesteadNodeDetailUITests
          - name: Play
            target: PlayMapUITests PlayModeNavigationUITests MysteryRecruitUITests ShopFlowUITests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            Scripts
            Packages
            Trinket
            TrinketUITests
            Trinket.xcodeproj
            ContentManifest
            ArtManifest
            MusicManifest
            SoundManifest
            CinematicManifest
            .github
      - name: Assert sparse checkout kept root build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f project.yml
          test -f Smoke.xctestplan
          test -f FullUI.xctestplan
          test -f BattlePerformance.xctestplan
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          build-artifact: ${{ needs.build.outputs.build-artifact }}
          artifact-name: ${{ inputs.artifact-prefix }}exhaustive-ui-${{ matrix.name }}
          rebuild-command: ./Scripts/build-for-testing.sh --app-only
          command: ./Scripts/test.sh ui --no-build ${{ matrix.target }}
          preboot-simulator: 'true'

  analyze:
    name: Advisory SwiftLint analyze
    needs: [changes, build]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    continue-on-error: true
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            Scripts
            Packages
            Trinket
            TrinketUITests
            Trinket.xcodeproj
            ContentManifest
            ArtManifest
            MusicManifest
            SoundManifest
            CinematicManifest
            .github
      - name: Assert sparse checkout kept root build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f project.yml
          test -f Smoke.xctestplan
          test -f FullUI.xctestplan
          test -f BattlePerformance.xctestplan
      - uses: ./.github/actions/setup-trinket
      - name: Download compiler logs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.build-artifact }}-compiler-logs
          path: .DerivedData/TestResults/raw
      - name: SwiftLint analyze
        continue-on-error: true
        env:
          SKIP_GENERATE: 1
        run: ./Scripts/lint-analyze.sh

  diff-review:
    name: Advisory diff review
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' || needs.changes.outputs.infra == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Change-budget summary
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          z40=0000000000000000000000000000000000000000
          if [[ -z "${BEFORE:-}" || "$BEFORE" == "$z40" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              base="HEAD^"
            else
              echo "No parent commit; skipping advisory diff review."
              exit 0
            fi
          else
            base="$BEFORE"
            git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --depth=1 origin "$base"
          fi
          mapfile -t paths < <(git diff --name-only --diff-filter=ACMR "$base" "$SHA" | sed '/^$/d')
          {
            echo "## Advisory diff review"
            echo
            echo "Base \`$base\` → \`$SHA\`."
            echo
            echo '```'
            if ((${#paths[@]} > 0)); then
              ./Scripts/change-budget.sh --base "$base" --paths "${paths[@]}"
            else
              echo "No authored paths in range."
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -f "$GITHUB_STEP_SUMMARY" ]] && grep -q "production Swift in .* changed with no test path" "$GITHUB_STEP_SUMMARY"; then
            echo "::notice::Production Swift changed without matching package tests. See the Advisory diff review summary."
          fi

  # Aggregate status for dashboards (not a required push gate on main).
  # Check name appears as "tests / CI OK" to callers of this reusable workflow.
  # Exhaustive UI is advisory (nightly/dispatch) so it never blocks pushes.
  ci-ok:
    name: CI OK
    needs: [changes, gate, assets-gate, build, unit, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job failed or was cancelled."
              exit 1
            fi
          done

  # Advisory aggregate — visible but not a required gate. Useful for nightly
  # dashboards; always succeeds on push so it never blocks ci-ok.
  exhaustive-ok:
    name: Exhaustive OK (advisory)
    needs: [changes, exhaustive-ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report exhaustive status
        env:
          RESULTS: ${{ join(needs.exhaustive-ui.result, ' ') }}
          INCLUDED: ${{ inputs.include-exhaustive }}
        run: |
          echo "Exhaustive included: $INCLUDED"
          echo "Exhaustive results: $RESULTS"
          if [ "$INCLUDED" != "true" ]; then
            echo "Exhaustive was not requested for this run — advisory OK."
            exit 0
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::warning::Advisory exhaustive shard failed: $RESULTS"
              exit 0
            fi
          done
          echo "Advisory exhaustive passed."
