name: Build and test

# Shared build-once test fan-out used by ci.yml.
# Warm DerivedData: primary key build-<nonsource>-<full>; restore-keys
# build-<nonsource>- for same toolchain/assets incremental source rebuilds.
# Within-run fan-out uses a run-scoped artifact of pruned .DerivedData. The
# build job compiles the app and every package test scheme so unit can run
# with --no-build; smoke and exhaustive UI rebuild app-only on artifact miss.
# The exhaustive UI suite is sharded by feature so post-push validation does not
# serialize every journey on one CI simulator.

on:
  workflow_call:
    inputs:
      include-exhaustive:
        description: Also run the sharded exhaustive UI suite
        required: false
        type: boolean
        default: false
      artifact-prefix:
        description: Prefix for uploaded test-result artifact names
        required: false
        type: string
        default: ''

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  gate:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/gate.yml

  assets-gate:
    name: Asset codegen
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.assets == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      # Same semantics as local ./Scripts/ci-assets-gate.sh (single owner).
      - name: Asset codegen gate
        run: >-
          python3 Scripts/output-profile.py run
          --label ci-assets-gate
          --policy ci-assets-gate
          -- ./Scripts/ci-assets-gate.sh
      - name: Report CI output profile
        if: always()
        continue-on-error: true
        shell: bash
        run: python3 Scripts/output-profile.py report --ci .DerivedData/OutputProfiles --actionable --top 3
      - name: Upload CI output profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.workflow }}-assets-output-profile-${{ github.run_id }}
          path: .DerivedData/OutputProfiles/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: ignore

  build:
    name: Build for testing
    needs: [changes, gate]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      build-artifact: ${{ steps.restore-and-build.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      - name: Restore warm cache and build
        id: restore-and-build
        uses: ./.github/actions/restore-and-build
        with:
          artifact-prefix: ${{ inputs.artifact-prefix }}
          prune: 'true'
          save-cache: 'true'
          upload-artifact: 'true'

  unit:
    name: Unit tests
    needs: [changes, build]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: macos-26
    # Package schemes are built in the shared build job; this job runs tests
    # only against the warmed artifact (--no-build), with a full rebuild on miss.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          profile-label: unit-tests
          build-artifact: ${{ needs.build.outputs.build-artifact }}
          artifact-name: ${{ inputs.artifact-prefix }}unit
          # Package schemes are in the shared build artifact; rebuild the full
          # warm tree on miss so --no-build can run tests only.
          rebuild-command: ./Scripts/build-for-testing.sh
          command: ./Scripts/test.sh unit --no-build

  smoke:
    name: Smoke tests
    needs: [changes, build]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          profile-label: smoke-tests
          build-artifact: ${{ needs.build.outputs.build-artifact }}
          artifact-name: ${{ inputs.artifact-prefix }}smoke
          rebuild-command: ./Scripts/build-for-testing.sh --app-only
          command: ./Scripts/test.sh smoke --no-build

  exhaustive-ui:
    name: Exhaustive UI (${{ matrix.name }})
    needs: [changes, build]
    if: >-
      inputs.include-exhaustive &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Battle
            target: BattleFlowUITests
          - name: Collection
            target: TabNavigationUITests HeroDetailAbilityPickerUITests HomesteadNodeDetailUITests
          - name: Play
            target: PlayMapUITests PlayModeNavigationUITests MysteryRecruitUITests ShopFlowUITests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          profile-label: exhaustive-ui-${{ matrix.name }}
          build-artifact: ${{ needs.build.outputs.build-artifact }}
          artifact-name: ${{ inputs.artifact-prefix }}exhaustive-ui-${{ matrix.name }}
          rebuild-command: ./Scripts/build-for-testing.sh --app-only
          command: ./Scripts/test.sh ui --no-build ${{ matrix.target }}

  diff-review:
    name: Advisory diff review
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Change-budget summary
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          z40=0000000000000000000000000000000000000000
          if [[ -z "${BEFORE:-}" || "$BEFORE" == "$z40" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              base="HEAD^"
            else
              echo "No parent commit; skipping advisory diff review."
              exit 0
            fi
          else
            base="$BEFORE"
            git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --depth=1 origin "$base"
          fi
          mapfile -t paths < <(git diff --name-only --diff-filter=ACMR "$base" "$SHA" | sed '/^$/d')
          {
            echo "## Advisory diff review"
            echo
            echo "Base \`$base\` → \`$SHA\`."
            echo
            echo '```'
            if ((${#paths[@]} > 0)); then
              ./Scripts/change-budget.sh --base "$base" --paths "${paths[@]}"
            else
              echo "No authored paths in range."
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -f "$GITHUB_STEP_SUMMARY" ]] && grep -q "production Swift in .* changed with no test path" "$GITHUB_STEP_SUMMARY"; then
            echo "::notice::Production Swift changed without matching package tests. See the Advisory diff review summary."
          fi

  # Aggregate status for dashboards (not a required push gate on main).
  # Check name appears as "tests / CI OK" to callers of this reusable workflow.
  ci-ok:
    name: CI OK
    needs: [changes, gate, assets-gate, build, unit, smoke, exhaustive-ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job failed or was cancelled."
              exit 1
            fi
          done
