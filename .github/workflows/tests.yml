name: Build and test

# Shared build-once test fan-out used by ci.yml.
# Warm DerivedData: primary key build-<nonsource>-<full>; restore-keys
# build-<nonsource>- for same toolchain/assets incremental source rebuilds.
# Within-run fan-out uses a run-scoped artifact of pruned .DerivedData. The
# build job is app-only (the app scheme compiles every package as a dependency)
# so package-scheme builds stay off the shared fan-out critical path; the unit
# job builds and runs all package schemes itself via test.sh unit. The
# exhaustive UI suite is sharded by feature so post-push validation does not
# serialize every journey on one CI simulator.

on:
  workflow_call:
    inputs:
      include-exhaustive:
        description: Also run the sharded exhaustive UI suite
        required: false
        type: boolean
        default: false
      artifact-prefix:
        description: Prefix for uploaded test-result artifact names
        required: false
        type: string
        default: ''

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  gate:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/gate.yml

  assets-gate:
    name: Asset codegen
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.assets == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      # Same semantics as local ./Scripts/ci-assets-gate.sh (single owner).
      - name: Asset codegen gate
        run: ./Scripts/ci-assets-gate.sh

  build:
    name: Build for testing
    needs: [changes, gate]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    outputs:
      build-artifact: ${{ steps.restore-and-build.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      - name: Restore warm cache and build
        id: restore-and-build
        uses: ./.github/actions/restore-and-build
        with:
          artifact-prefix: ${{ inputs.artifact-prefix }}
          prune: 'true'
          save-cache: 'true'
          upload-artifact: 'true'

  unit:
    name: Unit tests
    needs: [changes, build]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: macos-26
    # Cold package-scheme builds (uncached) plus the full parallel package test
    # run; 25 min was the old full-build budget, give the test phase headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          build-artifact: ${{ needs.build.outputs.build-artifact }}
          artifact-name: ${{ inputs.artifact-prefix }}unit
          # Bare `test.sh unit` runs package schemes only (no app build/plan),
          # so an artifact miss needs no app rebuild here — test.sh unit
          # cold-builds the package schemes itself. This means package builds
          # are uncached per run; re-measure unit wall-time and revisit the
          # 30-min timeout or cache coverage if the job starts to lag.
          rebuild-command: 'true'
          command: ./Scripts/test.sh unit

  smoke:
    name: Smoke tests
    needs: [changes, build]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          build-artifact: ${{ needs.build.outputs.build-artifact }}
          artifact-name: ${{ inputs.artifact-prefix }}smoke
          rebuild-command: ./Scripts/build-for-testing.sh --app-only
          command: ./Scripts/test.sh smoke --no-build

  exhaustive-ui:
    name: Exhaustive UI (${{ matrix.name }})
    needs: [changes, build]
    if: >-
      inputs.include-exhaustive &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Battle
            target: BattleFlowUITests
          - name: Collection
            target: TabNavigationUITests
          - name: Play
            target: PlayMapUITests PlayModeNavigationUITests MysteryRecruitUITests ShopFlowUITests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      - uses: ./.github/actions/test-job
        with:
          build-artifact: ${{ needs.build.outputs.build-artifact }}
          artifact-name: ${{ inputs.artifact-prefix }}exhaustive-ui-${{ matrix.name }}
          rebuild-command: ./Scripts/build-for-testing.sh --app-only
          command: ./Scripts/test.sh ui --no-build ${{ matrix.target }}

  # Aggregate status for dashboards (not a required push gate on main).
  # Check name appears as "tests / CI OK" to callers of this reusable workflow.
  ci-ok:
    name: CI OK
    needs: [changes, gate, assets-gate, build, unit, smoke, exhaustive-ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job failed or was cancelled."
              exit 1
            fi
          done
