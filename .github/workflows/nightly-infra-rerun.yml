name: Nightly infra rerun

# One automatic retry when Nightly fails only on simulator/XCUITest launch
# infrastructure. Real product or performance-gate failures stay red and are
# reported on a pinned "Nightly failing on main" issue so they don't go
# unnoticed in the Actions tab.
on:
  workflow_run:
    workflows: ["Nightly"]
    types: [completed]

concurrency:
  group: nightly-infra-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  follow-up:
    name: Rerun infra flakes or report failure
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Classify and rerun failed Nightly jobs once
        id: classify
        if: github.event.workflow_run.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          echo "Inspecting Nightly run $RUN_ID (attempt ${{ github.event.workflow_run.run_attempt }})"
          if ./Scripts/ci-infra-rerun.sh --run-id "$RUN_ID" --rerun; then
            echo "Dispatched gh run rerun --failed for simulator infrastructure."
            echo "rerun=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not an infrastructure-only failure; leaving Nightly red."
            echo "rerun=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update nightly failure issue
        if: github.event.workflow_run.run_attempt != 1 || steps.classify.outputs.rerun == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          title="Nightly failing on main"
          body="Nightly failed for ${HEAD_SHA} (attempt ${RUN_ATTEMPT}): ${RUN_URL}"
          has_issues="$(gh api "repos/$REPO" --jq '.has_issues')"
          if [ "$has_issues" != "true" ]; then
            {
              echo "## Nightly failure (Issues disabled)"
              echo
              echo "$body"
              echo
              echo "GitHub Issues are disabled on \`$REPO\`; skipping issue create/comment."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Issues disabled on $REPO; recorded failure in step summary."
            exit 0
          fi
          existing="$(gh issue list --repo "$REPO" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
