name: Nightly infra rerun

# One automatic retry when Nightly fails only on simulator/XCUITest launch
# infrastructure. Real product or performance-gate failures stay red.
on:
  workflow_run:
    workflows: ["Nightly"]
    types: [completed]

concurrency:
  group: nightly-infra-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  maybe-rerun:
    name: Rerun Nightly on simulator infra
    if: >
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Classify and rerun failed Nightly jobs once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          echo "Inspecting Nightly run $RUN_ID (attempt ${{ github.event.workflow_run.run_attempt }})"
          if ./Scripts/ci-infra-rerun.sh --run-id "$RUN_ID" --rerun; then
            echo "Dispatched gh run rerun --failed for simulator infrastructure."
          else
            echo "Not an infrastructure-only failure; leaving Nightly red."
          fi
