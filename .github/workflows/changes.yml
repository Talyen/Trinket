name: Detect changes

on:
  workflow_call:
    outputs:
      code:
        description: Whether app, package, test, or manifest sources changed
        value: ${{ jobs.changes.outputs.code }}
      assets:
        description: Whether any processed asset input changed
        value: ${{ jobs.changes.outputs.assets }}

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      assets: ${{ steps.filter.outputs.assets }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050 # v3
        id: filter
        with:
          filters: |
            code:
              - 'Trinket/**'
              - 'Packages/**'
              - 'TrinketUITests/**'
              - 'ContentManifest/**'
              - 'ArtManifest/**'
              - 'MusicManifest/**'
              - 'SoundManifest/**'
              - 'CinematicManifest/**'
              - 'Raw Assets/**'
              - 'Scripts/**'
              # Prose-only script edits do not affect build/test behavior.
              - '!Scripts/**/*.md'
              - 'project.yml'
              - 'Trinket.xcodeproj/**'
              - '*.xctestplan'
              - '.swiftlint.yml'
              - '.swiftformat'
              - 'cliff.toml'
              # Workflow/action changes that affect build/test behavior.
              - '.github/actions/**'
              - '.github/workflows/**'
            assets:
              - 'ArtManifest/**'
              - 'MusicManifest/**'
              - 'SoundManifest/**'
              - 'CinematicManifest/**'
              - 'Raw Assets/**'
              - 'Scripts/prepare-art-assets.sh'
              - 'Scripts/prepare-music-assets.sh'
              - 'Scripts/prepare-sfx-assets.sh'
              - 'Scripts/prepare-cinematic-assets.sh'
              - 'Scripts/prepare-app-icon.sh'
