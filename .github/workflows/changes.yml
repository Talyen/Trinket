name: Detect changes

on:
  workflow_call:
    outputs:
      units:
        description: Whether affected package suites need execution
        value: ${{ jobs.changes.outputs.units }}
      unit-matrix:
        description: Affected packages grouped by their existing shard owners
        value: ${{ jobs.changes.outputs.unit-matrix }}
      code:
        description: Whether app, package, test, or manifest sources changed
        value: ${{ jobs.changes.outputs.code }}
      assets:
        description: Whether any processed asset input changed
        value: ${{ jobs.changes.outputs.assets }}
      infra:
        description: Whether Scripts, workflows, or style config changed
        value: ${{ jobs.changes.outputs.infra }}
      smoke:
        description: Whether app, UI, feature wiring, or test orchestration changed
        value: ${{ jobs.changes.outputs.smoke }}

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      units: ${{ steps.filter.outputs.units }}
      unit-matrix: ${{ steps.filter.outputs.unit-matrix }}
      code: ${{ steps.filter.outputs.code }}
      assets: ${{ steps.filter.outputs.assets }}
      infra: ${{ steps.filter.outputs.infra }}
      smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      # Push events cannot use dorny REST mode (PR-only). Fetch the filter
      # script and the compare file list from the API so this job does not
      # clone Raw Assets / Packages.
      - name: Detect changed paths
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/trinket-path-filter/internal
          for path in ci-path-filter.py build-inputs.env internal/cli.py; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/Scripts/${path}?ref=${SHA}" \
              --jq .content | base64 --decode > "/tmp/trinket-path-filter/${path}"
          done
          python3 /tmp/trinket-path-filter/ci-path-filter.py
