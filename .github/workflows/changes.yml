name: Detect changes

on:
  workflow_call:
    outputs:
      code:
        description: Whether app, package, test, or manifest sources changed
        value: ${{ jobs.changes.outputs.code }}
      assets:
        description: Whether any processed asset input changed
        value: ${{ jobs.changes.outputs.assets }}
      infra:
        description: Whether Scripts, workflows, or style config changed
        value: ${{ jobs.changes.outputs.infra }}

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      assets: ${{ steps.filter.outputs.assets }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      # Push events cannot use dorny REST mode (PR-only). Fetch the filter
      # script and the compare file list from the API so this job does not
      # clone Raw Assets / Packages.
      - name: Detect changed paths
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/Scripts/ci-path-filter.py?ref=${SHA}" \
            --jq .content | base64 --decode > /tmp/ci-path-filter.py
          python3 /tmp/ci-path-filter.py
