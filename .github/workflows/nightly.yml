name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Check for new commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Skip when HEAD already passed the last Nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch; running."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_green_sha="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?status=success&branch=main&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"
          if [ "$last_green_sha" = "${{ github.sha }}" ]; then
            echo "HEAD ${{ github.sha }} already passed the last successful Nightly; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits since last successful Nightly (${last_green_sha:-none}); running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  gate:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    uses: ./.github/workflows/gate.yml

  integration:
    name: Integration tests
    needs: gate
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      # Restore-only: PR/main build jobs own cache write-back.
      # The restore default is app-only (package schemes are unit-job work), so
      # integration only needs the app + UI test bundles. Do not add save-cache
      # here without a measured miss/rebuild regression.
      - uses: ./.github/actions/restore-and-build
      - name: Run integration suite
        run: ./Scripts/test.sh all --no-build
        env:
          SKIP_GENERATE: 1
          CI: true
      - name: Classify CI outcome and report timing
        if: always()
        run: ./Scripts/ci-diagnostics.sh .DerivedData/TestResults
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-integration-${{ github.run_id }}
          path: .DerivedData/TestResults/
          if-no-files-found: ignore

  battle-performance:
    name: App performance gate
    needs: gate
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      - name: Run exclusive Battle performance matrix
        run: ./Scripts/performance.sh
        env:
          CI: true
          TRINKET_PERFORMANCE_OUTPUT_DIR: .DerivedData/PerformanceResults/nightly
      - name: Classify CI outcome and report timing
        if: always()
        run: ./Scripts/ci-diagnostics.sh .DerivedData/PerformanceResults/nightly/TestResults
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-battle-performance-${{ github.run_id }}
          path: .DerivedData/PerformanceResults/nightly/
          if-no-files-found: warn
