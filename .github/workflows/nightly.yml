name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  integration:
    name: Integration tests
    needs: gate
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-trinket
      - name: Build all test bundles
        run: ./Scripts/build-for-testing.sh
        env:
          SKIP_GENERATE: 1
      - name: Run integration suite
        run: TRINKET_RUN_A11Y_AUDITS=1 ./Scripts/test.sh all --no-build --verbose
        env:
          SKIP_GENERATE: 1
          CI: true
      - name: Classify CI outcome and report timing
        if: always()
        run: ./Scripts/ci-diagnostics.sh .DerivedData/TestResults
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-integration-${{ github.run_id }}
          path: .DerivedData/TestResults/
          if-no-files-found: ignore
