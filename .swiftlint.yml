# SwiftLint enforces semantics and API idioms. Formatting (whitespace, commas,
# trailing newlines) is owned by SwiftFormat (.swiftformat). Product UI chrome is
# guarded by Scripts/check-ui-style.sh (TrinketDesign / UIStyleCheck: allow).
# See Scripts/README.md "Style & lint ownership".
#
# Analyzer rules (unused_import, unused_declaration) need `swiftlint analyze` plus
# a compiler index/log and are intentionally not part of the fail-closed style gate.
# CI runs them in an advisory job after the shared build (Scripts/lint-analyze.sh).
analyzer_rules:
  - unused_import
  - unused_declaration

# Public package API is consumed across modules; analyze the non-public remainder.
unused_declaration:
  include_public_and_open: false

swiftlint_version: 0.65.0

opt_in_rules:
  - explicit_init
  - first_where
  - prefer_key_path
  - contains_over_first_not_nil
  - empty_string
  - empty_count
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_random
  - prohibited_super_call
  - overridden_super_call
  - reduce_into
  - redundant_nil_coalescing
  - array_init
  - unhandled_throwing_task
  - modifier_order
  - implicit_return
  - async_without_await
  - force_unwrapping
  - force_cast
  - force_try
  - duplicate_imports
  - contains_over_filter_is_empty
  - contains_over_filter_count
  - prefer_zero_over_explicit_init
  - single_test_class
  - xct_specific_matcher
  - toggle_bool
  - legacy_multiple
  - sorted_first_last
  - private_swiftui_state
  - implicitly_unwrapped_optional
  - unused_optional_binding
  - duplicate_conditions
  - yoda_condition
  - optional_enum_case_matching
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - self_binding
  - unneeded_override
  - shorthand_optional_binding
  - superfluous_else
  - fatal_error_message
  # no_empty_block omitted: fights Codable `init() {}`, SwiftUI dismiss
  # `Button { }`, default no-op closures, and `while predicate() {}` drains.

disabled_rules:
  - line_length
  - identifier_name
  - todo
  - large_tuple
  - trailing_comma
  - trailing_newline
  - vertical_whitespace
  - statement_position

# Force unwrap / cast / try are opt-in above. Under `strict` + `lint.sh --strict`
# they fail the gate; keep production code free of them and prefer XCTUnwrap /
# #require / guard-let in tests.
force_unwrapping: error
force_cast: error
force_try: error

file_length:
  warning: 550
  error: 750

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3

# Structural guardrails use generous thresholds above. Keep large generated or
# catalog content split across focused files instead of raising limits further.
function_parameter_count:
  warning: 7
  error: 9

# Platform bans from AGENTS.md — prefer @Observable / NavigationStack.
# Regex custom_rules need SourceKit (skipped on Linux portable builds); style also
# runs Scripts/check-platform-api-bans.sh so Linux/CI tools still enforce these.
# Adaptive Color.primary / .secondary / .clear stay allowed (see check-ui-style.sh).
custom_rules:
  banned_observation_apis:
    name: "Banned Observation APIs"
    regex: '(?<!\w)(@Published|@StateObject|@EnvironmentObject|@ObservedObject|ObservableObject)(?!\w)'
    message: "Use @Observable with @Environment(Type.self) and @Bindable instead."
    severity: error
  banned_navigation_view:
    name: "Banned NavigationView"
    regex: '(?<!\w)NavigationView(?!\w)'
    message: "Use NavigationStack instead of NavigationView."
    severity: error
  banned_raw_rgb_color:
    name: "Banned raw RGB Color"
    regex: 'Color\s*\(\s*red\s*:'
    message: "Use TrinketDesign.Colors / DesignColors assets via DesignAssetColors — not Color(red:green:blue:). See Packages/TrinketDesignSystem/README.md."
    severity: error
  banned_system_color_literal:
    name: "Banned system Color literal"
    regex: '(?<!\w)Color\.(red|green|blue|orange|yellow|pink|purple|mint|teal|indigo|brown|cyan|gray|grey|black|white|accentColor)\b'
    message: "Use TrinketDesign.Colors, Overlay, keyword/homestead/resource helpers — not SwiftUI system Color.* literals."
    severity: error
  banned_system_shape_style_literal:
    name: "Banned system shape-style color"
    regex: '\.(foregroundStyle|tint|fill|stroke|background)\(\.(white|black|red|green|blue|orange|yellow|pink|purple|mint|teal|indigo|brown|cyan|gray|grey|accentColor)\b'
    message: "Use TrinketDesign.Colors / Overlay tokens instead of .foregroundStyle(.white) / .fill(.red) and similar."
    severity: error
  banned_app_bundle_named_color:
    name: "Banned app-bundle named Color"
    regex: 'Color\s*\(\s*"[^"]+"\s*,\s*bundle\s*:\s*\.main\b'
    message: "Move named colors into DesignColors.xcassets and expose them via TrinketDesignSystem."
    severity: error
  banned_comments:
    name: "Banned comments"
    regex: '//(?!\s*(swift-tools-version:|swiftlint:(disable|enable)|swiftformat:(disable|enable)|Generated by|.*(UIStyleCheck|EntropyCheck|PersistenceCheck|ConcurrencyCheck|ExclusivityCheck|ArtworkWorkingSetCheck|TestSleepCheck):\s*allow|.*Concurrency-Safety:))|/\*'
    match_kinds:
      - comment
    message: "Comments banned — remove or use an allowed toolchain directive (swift-tools-version / swiftlint:disable / swiftformat:disable). See doc-budget skill."
    severity: error

excluded:
  - Packages/TrinketContent/Sources/TrinketContent/Generated
  - .DerivedData
  - .build
  - build
  - "Packages/*/build"
  - "Packages/*/.build"
  # DEBUG feel-tuning lab; intentionally dense parameter surface.
  - Packages/TrinketBattleFeature/Sources/TrinketBattleFeature/Features/Layout/BattleHandMotionLab.swift
  - Packages/TrinketBattleFeature/Sources/TrinketBattleFeature/Features/Feedback/CombatFeedbackFloatMotionLab.swift

strict: true
