# SwiftLint enforces semantics and API idioms. Formatting (whitespace, commas,
# trailing newlines) is owned by SwiftFormat (.swiftformat). Product UI chrome is
# guarded by Scripts/check-ui-style.sh (TrinketDesign / UIStyleCheck: allow).
swiftlint_version: 0.65.0

opt_in_rules:
  - explicit_init
  - first_where
  - prefer_key_path
  - contains_over_first_not_nil
  - empty_string
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_random
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - array_init
  - unhandled_throwing_task
  - modifier_order
  - implicit_return
  - async_without_await

disabled_rules:
  - line_length
  - identifier_name
  - todo
  - function_body_length
  - file_length
  - type_body_length
  - cyclomatic_complexity
  - nesting
  - large_tuple
  - trailing_comma
  - trailing_newline
  - vertical_whitespace
  - inclusive_language
  - statement_position

function_parameter_count:
  warning: 7
  error: 9

excluded:
  - Trinket/Generated
  - .DerivedData
  - .build

strict: true
