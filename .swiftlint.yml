# SwiftLint enforces semantics and API idioms. Formatting (whitespace, commas,
# trailing newlines) is owned by SwiftFormat (.swiftformat). Product UI chrome is
# guarded by Scripts/check-ui-style.py (TrinketDesign / UIStyleCheck: allow).
# See Scripts/README.md "Style & lint ownership".
#
# Ownership split for bans: portable ripgrep checks own enforcement
# (check-api-bans.sh for observation/navigation, check-agent-invariants.sh for
# entropy/sleep/persistence/artwork/disables). SwiftLint custom_rules below
# mirror ONLY patterns that are valid NSRegularExpression; variable-length
# lookbehind (e.g. (?<!//.*)) is invalid and silently disables the rule, so
# comment-sensitive bans must live in the shell checks, never here.
#
# Analyzer rules need `swiftlint analyze` plus a compiler index/log.
# Scripts/lint-analyze.sh fails the run on unused_import (dead code is
# blocking); capture_variable and unused_declaration stay advisory.
# CI runs it as a blocking job after the shared build (Scripts/lint-analyze.sh).
analyzer_rules:
  - capture_variable
  - unused_import
  - unused_declaration

# Public package API is consumed across modules; analyze the non-public remainder.
unused_declaration:
  include_public_and_open: false

swiftlint_version: 0.65.0

# modifier_order lives here, not in SwiftFormat (.swiftformat disables
# modifierOrder): the compiler-required `public nonisolated` spelling beats
# the rule, so that site carries a reasoned swiftlint:disable:next.
# single_test_class / balanced_xctest_lifecycle / xct_specific_matcher stay
# until the XCTest-to-Swift-Testing migration (check-api-bans.sh) completes,
# then retire them.
opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - closure_body_length
  - empty_string
  - identical_operands
  - joined_default_parameter
  - last_where
  - lower_acl_than_parent
  - prohibited_super_call
  - overridden_super_call
  - reduce_into
  - redundant_nil_coalescing
  - array_init
  - unhandled_throwing_task
  - modifier_order
  - async_without_await
  - force_unwrapping
  - prefer_zero_over_explicit_init
  - single_test_class
  - xct_specific_matcher
  - toggle_bool
  - legacy_multiple
  - implicitly_unwrapped_optional
  - optional_enum_case_matching
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - self_binding
  - shorthand_optional_binding
  - superfluous_else
  - fatal_error_message
  - unowned_variable_capture
  - discarded_notification_center_observer
  - weak_delegate
  - convenience_type
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - unneeded_parentheses_in_closure_argument
  - return_value_from_void_function
  - unavailable_function
  - static_operator
  - balanced_xctest_lifecycle
  - enum_case_associated_values_count
  - prohibited_interface_builder
  - raw_value_for_camel_cased_codable_enum
  - untyped_error_in_catch
  - fallthrough
  - unneeded_escaping
  - unneeded_throws_rethrows
  # no_empty_block omitted: fights Codable `init() {}`, SwiftUI dismiss
  # `Button { }`, default no-op closures, and `while predicate() {}` drains.

disabled_rules:
  # SwiftFormat owns these mechanical rewrites in the style gate
  # (see .swiftformat --enable: isEmpty, preferContains, preferFirstWhere,
  # preferCountWhere, preferMinOverSorted, preferFlatMap, preferSwiftTesting).
  # Do not re-enable the SwiftLint counterparts.
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - duplicate_imports
  - empty_count
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - implicit_return
  - prefer_key_path
  - redundant_discardable_let
  - sorted_first_last
  - yoda_condition
  # Formatting owned by SwiftFormat (maxwidth 140, trailing commas, newlines).
  - trailing_comma
  - trailing_newline
  - vertical_whitespace
  - statement_position
  - line_length
  # Deliberately off with reason:
  # - private_swiftui_state: @Observable replaced @State wrappers; the rule
  #   pushes legacy state patterns.
  # - identifier_name: game domain and SwiftUI DSL use short names pervasively.
  # - large_tuple: 3-element tuples (coordinates, test rows) are idiomatic;
  #   cyclomatic_complexity bounds the egregious cases.
  - private_swiftui_state
  - identifier_name
  - large_tuple

# Force unwrap is opt-in; cast and try are default rules. Strict mode makes all
# three fail the gate. Prefer XCTUnwrap / #require / guard-let in tests.
force_unwrapping: error
force_cast: error
force_try: error

file_length: 600
type_body_length: 350
function_body_length: 60
closure_body_length: 80
cyclomatic_complexity: 15

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3

# Structural guardrails use generous thresholds above. Keep large generated or
# catalog content split across focused files instead of raising limits further.
function_parameter_count: 7

# Platform bans from AGENTS.md — prefer @Observable / NavigationStack.
# check-api-bans.sh is the portable owner and runs in every style gate;
# the observation/navigation customs below are editor-speed mirrors only.
# Entropy, test-sleep, persistence, and artwork bans live SOLELY in
# check-agent-invariants.sh: their patterns need comment awareness that
# NSRegularExpression cannot express, so SwiftLint copies were dead rules.
# Product color policy belongs to check-ui-style.py.
custom_rules:
  banned_observation_apis:
    name: "Banned Observation APIs"
    regex: '(?<!\w)(@Published|@StateObject|@EnvironmentObject|@ObservedObject|ObservableObject)(?!\w)'
    message: "Use @Observable with @Environment(Type.self) and @Bindable instead."
    severity: error
  banned_navigation_view:
    name: "Banned NavigationView"
    regex: '(?<!\w)NavigationView(?!\w)'
    message: "Use NavigationStack instead of NavigationView."
    severity: error
  banned_comments:
    name: "Banned comments"
    regex: '//(?!\s*(swift-tools-version:|swiftlint:(disable|enable)|swiftformat:(disable|enable)|Generated by|.*(UIStyleCheck|EntropyCheck|PersistenceCheck|ConcurrencyCheck|ExclusivityCheck|ArtworkWorkingSetCheck|TestSleepCheck):\s*allow\s*-\s*\S+|.*Concurrency-Safety:))|/\*'
    match_kinds:
      - comment
    message: "Comments banned — remove or use an allowed toolchain directive (swift-tools-version / swiftlint:disable / swiftformat:disable). See doc-budget skill."
    severity: error
  banned_swiftlint_disable_without_reason:
    name: "swiftlint:disable without reason"
    regex: '//\s*swiftlint:disable\b(?![^\n]*-\s*\S+)'
    message: "swiftlint:disable must include ' - <reason>'"
    severity: error

excluded:
  - Packages/TrinketContent/Sources/TrinketContent/Generated
  - .DerivedData
  - .build
  - build
  - "Packages/*/build"
  - "Packages/*/.build"

strict: true
