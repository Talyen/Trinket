# SwiftLint enforces semantics and API idioms. Formatting (whitespace, commas,
# trailing newlines) is owned by SwiftFormat (.swiftformat). Product UI chrome is
# guarded by Scripts/check-ui-style.py (TrinketDesign / UIStyleCheck: allow).
# See Scripts/README.md "Style & lint ownership".
#
# Analyzer rules need `swiftlint analyze` plus
# a compiler index/log and are intentionally not part of the fail-closed style gate.
# CI runs them in an advisory job after the shared build (Scripts/lint-analyze.sh).
analyzer_rules:
  - capture_variable
  - unused_import
  - unused_declaration

# Public package API is consumed across modules; analyze the non-public remainder.
unused_declaration:
  include_public_and_open: false

swiftlint_version: 0.65.0

opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - closure_body_length
  - empty_string
  - identical_operands
  - joined_default_parameter
  - last_where
  - lower_acl_than_parent
  - prohibited_super_call
  - overridden_super_call
  - reduce_into
  - redundant_nil_coalescing
  - array_init
  - unhandled_throwing_task
  - modifier_order
  - async_without_await
  - force_unwrapping
  - prefer_zero_over_explicit_init
  - single_test_class
  - xct_specific_matcher
  - toggle_bool
  - legacy_multiple
  - implicitly_unwrapped_optional
  - optional_enum_case_matching
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - self_binding
  - shorthand_optional_binding
  - superfluous_else
  - fatal_error_message
  - unowned_variable_capture
  - discarded_notification_center_observer
  - weak_delegate
  - convenience_type
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - unneeded_parentheses_in_closure_argument
  - return_value_from_void_function
  - unavailable_function
  - static_operator
  - balanced_xctest_lifecycle
  - enum_case_associated_values_count
  - prohibited_interface_builder
  - raw_value_for_camel_cased_codable_enum
  - untyped_error_in_catch
  - fallthrough
  - unneeded_escaping
  - unneeded_throws_rethrows
  # no_empty_block omitted: fights Codable `init() {}`, SwiftUI dismiss
  # `Button { }`, default no-op closures, and `while predicate() {}` drains.

disabled_rules:
  # SwiftFormat owns these mechanical rewrites in the style gate.
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - duplicate_imports
  - empty_count
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - implicit_return
  - prefer_key_path
  - private_swiftui_state
  - redundant_discardable_let
  - sorted_first_last
  - unused_optional_binding
  - unused_parameter
  - yoda_condition
  - line_length
  - identifier_name
  - todo
  - large_tuple
  - trailing_comma
  - trailing_newline
  - vertical_whitespace
  - statement_position

# Force unwrap is opt-in; cast and try are default rules. Strict mode makes all
# three fail the gate. Prefer XCTUnwrap / #require / guard-let in tests.
force_unwrapping: error
force_cast: error
force_try: error

file_length: 600
type_body_length: 350
function_body_length: 60
closure_body_length: 80
cyclomatic_complexity: 15

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3

# Structural guardrails use generous thresholds above. Keep large generated or
# catalog content split across focused files instead of raising limits further.
function_parameter_count: 7

# Platform bans from AGENTS.md — prefer @Observable / NavigationStack. Regex
# custom_rules need SourceKit, so check-api-bans.sh mirrors them for
# portable builds. Product color policy belongs to check-ui-style.py.
custom_rules:
  banned_observation_apis:
    name: "Banned Observation APIs"
    regex: '(?<!\w)(@Published|@StateObject|@EnvironmentObject|@ObservedObject|ObservableObject)(?!\w)'
    message: "Use @Observable with @Environment(Type.self) and @Bindable instead."
    severity: error
  banned_navigation_view:
    name: "Banned NavigationView"
    regex: '(?<!\w)NavigationView(?!\w)'
    message: "Use NavigationStack instead of NavigationView."
    severity: error
  banned_comments:
    name: "Banned comments"
    regex: '//(?!\s*(swift-tools-version:|swiftlint:(disable|enable)|swiftformat:(disable|enable)|Generated by|.*(UIStyleCheck|EntropyCheck|PersistenceCheck|ConcurrencyCheck|ExclusivityCheck|ArtworkWorkingSetCheck|TestSleepCheck):\s*allow\s*-\s*\S+|.*Concurrency-Safety:))|/\*'
    match_kinds:
      - comment
    message: "Comments banned — remove or use an allowed toolchain directive (swift-tools-version / swiftlint:disable / swiftformat:disable). See doc-budget skill."
    severity: error
  banned_task_sleep:
    name: "Task.sleep in tests"
    regex: '(?<!//.*)Task\.sleep\s*\((?![^)]*\.milliseconds)'
    included:
      - "Packages/*/Tests"
    message: "Task.sleep in package tests must poll with .milliseconds or use TestSleepCheck: allow"
    severity: error
  banned_persistence_try_question:
    name: "Persistence try? ban"
    regex: '(?<!//.*)\btry\?'
    included:
      - "Packages/TrinketPersistence/Sources/TrinketPersistence"
    message: "try? on persistence write/open; use an explicit path or PersistenceCheck: allow"
    severity: error
  banned_battle_engine_date_uuid:
    name: "BattleEngine unseeded Date()/UUID()"
    regex: '(?<!//.*)\b(Date|UUID)\(\)'
    included:
      - "Packages/BattleEngine/Sources/BattleEngine"
    message: "unseeded Date()/UUID() in BattleEngine rule code"
    severity: error
  banned_battle_engine_random:
    name: "BattleEngine unseeded .random()"
    regex: '(?<!//.*)\.random\s*\((?![^)]*using:)'
    included:
      - "Packages/BattleEngine/Sources/BattleEngine"
    message: "unseeded .random( in BattleEngine rule code (inject RNG via using:)"
    severity: error
  banned_swiftlint_disable_without_reason:
    name: "swiftlint:disable without reason"
    regex: '//\s*swiftlint:disable\b(?![^\n]*-\s*\S+)'
    message: "swiftlint:disable must include ' - <reason>'"
    severity: error
  banned_artwork_release_pins:
    name: "Launch artwork pin release"
    regex: '(?<!//.*)\breleasePins\b'
    included:
      - "Trinket/App/TrinketApp.swift"
    message: "do not release launch artwork pins after warmup (ArtworkWorkingSetCheck)"
    severity: error

excluded:
  - Packages/TrinketContent/Sources/TrinketContent/Generated
  - .DerivedData
  - .build
  - build
  - "Packages/*/build"
  - "Packages/*/.build"
  # DEBUG feel-tuning lab; intentionally dense parameter surface.
  - Packages/TrinketBattleFeature/Sources/TrinketBattleFeature/Features/Layout/BattleHandMotionLab.swift
  - Packages/TrinketBattleFeature/Sources/TrinketBattleFeature/Features/Feedback/CombatFeedbackFloatMotionLab.swift

strict: true
