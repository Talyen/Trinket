# SwiftLint enforces semantics and API idioms. Formatting (whitespace, commas,
# trailing newlines) is owned by SwiftFormat (.swiftformat). Product UI chrome is
# guarded by Scripts/check-ui-style.sh (TrinketDesign / UIStyleCheck: allow).
# See Scripts/README.md "Style & lint ownership".
swiftlint_version: 0.65.0

opt_in_rules:
  - explicit_init
  - first_where
  - prefer_key_path
  - contains_over_first_not_nil
  - empty_string
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_random
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - array_init
  - unhandled_throwing_task
  - modifier_order
  - implicit_return
  - async_without_await
  - force_unwrapping
  - force_cast
  - force_try

disabled_rules:
  - line_length
  - identifier_name
  - todo
  - large_tuple
  - trailing_comma
  - trailing_newline
  - vertical_whitespace
  - statement_position

# Force unwrap / cast / try are opt-in above. Under `strict` + `lint.sh --strict`
# they fail the gate; keep production code free of them and prefer XCTUnwrap /
# #require / guard-let in tests.
force_unwrapping: error
force_cast: error
force_try: error

file_length:
  warning: 550
  error: 750

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3

# Structural guardrails use generous thresholds above. Keep large generated or
# catalog content split across focused files instead of raising limits further.
function_parameter_count:
  warning: 7
  error: 9

# Platform bans from AGENTS.md — prefer @Observable / NavigationStack.
# Regex custom_rules need SourceKit (skipped on Linux portable builds); style also
# runs Scripts/check-platform-api-bans.sh so Linux/CI tools still enforce these.
custom_rules:
  banned_observation_apis:
    name: "Banned Observation APIs"
    regex: '(?<!\w)(@Published|@StateObject|@EnvironmentObject|@ObservedObject|ObservableObject)(?!\w)'
    message: "Use @Observable with @Environment(Type.self) and @Bindable instead."
    severity: error
  banned_navigation_view:
    name: "Banned NavigationView"
    regex: '(?<!\w)NavigationView(?!\w)'
    message: "Use NavigationStack instead of NavigationView."
    severity: error
  banned_raw_rgb_color:
    name: "Banned raw RGB Color"
    regex: 'Color\s*\(\s*red\s*:'
    message: "Use TrinketDesign.Colors / DesignColors assets via DesignAssetColors — not Color(red:green:blue:). See Packages/TrinketDesignSystem/README.md."
    severity: error
  banned_system_color_literal:
    name: "Banned system Color literal"
    regex: '(?<!\w)Color\.(red|green|blue|orange|yellow|pink|purple|mint|teal|indigo|brown|cyan|gray|grey|black|white)\b'
    message: "Use TrinketDesign.Colors, Overlay, keyword/homestead/resource helpers — not SwiftUI system Color.* literals."
    severity: error
  banned_system_shape_style_literal:
    name: "Banned system shape-style color"
    regex: '\.(foregroundStyle|tint|fill|stroke|background)\(\.(white|black|red|green|blue|orange|yellow|pink|purple|mint|teal|indigo|brown|cyan|gray|grey)\b'
    message: "Use TrinketDesign.Colors / Overlay tokens instead of .foregroundStyle(.white) / .fill(.red) and similar."
    severity: error
  banned_app_bundle_named_color:
    name: "Banned app-bundle named Color"
    regex: 'Color\s*\(\s*"[^"]+"\s*,\s*bundle\s*:\s*\.main\b'
    message: "Move named colors into DesignColors.xcassets and expose them via TrinketDesignSystem."
    severity: error

excluded:
  - Packages/TrinketContent/Sources/TrinketContent/Generated
  - .DerivedData
  - .build
  # DEBUG feel-tuning lab; intentionally dense parameter surface.
  - Trinket/Features/Battle/Layout/BattleHandMotionLab.swift
  - Trinket/Features/Battle/Feedback/CombatFeedbackFloatMotionLab.swift

strict: true
