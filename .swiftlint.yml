# SwiftLint enforces semantics and API idioms. Formatting (whitespace, commas,
# trailing newlines) is owned by SwiftFormat (.swiftformat). Product UI chrome is
# guarded by Scripts/check-ui-style.py (TrinketDesign / UIStyleCheck: allow).
# See Docs/Platform/Verification.md "Style and boundary ownership".
#
# Portable scripts own custom policy enforcement
# (check-api-bans.sh for observation/navigation, check-agent-invariants.sh for
# entropy/sleep/persistence/artwork/disables). API bans and suppression reasons
# inspect SwiftFormat tokens so prose is not mistaken for code or directives.
#
# Analyzer rules run explicitly through Scripts/lint-analyze.sh with a clean build.
# unused_import fails that command; other analyzer findings remain advisory.
analyzer_rules:
  - capture_variable
  - unused_import
  - unused_declaration

# Public package API is consumed across modules; analyze the non-public remainder.
unused_declaration:
  include_public_and_open: false

swiftlint_version: 0.65.0

# XCTest assertion idioms still apply to UI tests. single_test_class and
# balanced_xctest_lifecycle do not fit our shared XCTest base classes.
opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - closure_body_length
  - empty_string
  - identical_operands
  - joined_default_parameter
  - last_where
  - lower_acl_than_parent
  - prohibited_super_call
  - overridden_super_call
  - reduce_into
  - redundant_nil_coalescing
  - array_init
  - unhandled_throwing_task
  - async_without_await
  - force_unwrapping
  - prefer_zero_over_explicit_init
  - xct_specific_matcher
  - toggle_bool
  - legacy_multiple
  - implicitly_unwrapped_optional
  - optional_enum_case_matching
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - self_binding
  - superfluous_else
  - fatal_error_message
  - unowned_variable_capture
  - discarded_notification_center_observer
  - weak_delegate
  - convenience_type
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - return_value_from_void_function
  - unavailable_function
  - static_operator
  - enum_case_associated_values_count
  - prohibited_interface_builder
  - raw_value_for_camel_cased_codable_enum
  - untyped_error_in_catch
  - fallthrough
  - unneeded_escaping
  - unneeded_throws_rethrows
  # no_empty_block omitted: fights Codable `init() {}`, SwiftUI dismiss
  # `Button { }`, default no-op closures, and `while predicate() {}` drains.

disabled_rules:
  # SwiftFormat owns these mechanical rewrites in the style gate
  # (see .swiftformat --enable: isEmpty, preferContains, preferFirstWhere,
  # preferCountWhere, preferMinOverSorted, preferFlatMap, preferSwiftTesting).
  # Do not re-enable the SwiftLint counterparts.
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - control_statement
  - duplicate_imports
  - empty_count
  - empty_parentheses_with_trailing_closure
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - implicit_return
  - implicit_getter
  - prefer_key_path
  - private_over_fileprivate
  - redundant_discardable_let
  - redundant_string_enum_value
  - redundant_void_return
  - shorthand_optional_binding
  - sorted_first_last
  - trailing_semicolon
  - unneeded_break_in_switch
  - unneeded_parentheses_in_closure_argument
  - unused_closure_parameter
  - void_return
  - yoda_condition
  # Formatting owned by SwiftFormat (maxwidth 140, trailing commas, newlines).
  - closing_brace
  - colon
  - comma
  - comment_spacing
  - function_name_whitespace
  - no_space_in_method_call
  - return_arrow_whitespace
  - trailing_comma
  - trailing_newline
  - trailing_whitespace
  - vertical_parameter_alignment
  - vertical_whitespace
  - statement_position
  - line_length
  # Deliberately off with reason:
  # - private_swiftui_state: SwiftFormat's privateStateVariables owns this rewrite.
  # - identifier_name: game domain and SwiftUI DSL use short names pervasively.
  # - large_tuple: 3-element tuples (coordinates, test rows) are idiomatic.
  - private_swiftui_state
  - identifier_name
  - large_tuple

# Force unwrap is opt-in; cast and try are default rules. Strict mode makes all
# three fail the gate. Prefer XCTUnwrap / #require / guard-let in tests.
force_unwrapping: error
force_cast: error
force_try: error

file_length:
  warning: 600
  ignore_comment_only_lines: true
type_body_length: 350
function_body_length: 60
closure_body_length: 80
cyclomatic_complexity:
  warning: 15
  # Enum mappings remain exhaustive; branches within cases still count.
  ignores_case_statements: true

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3

# Structural guardrails use generous thresholds above. Keep authored catalog
# content split across focused files instead of raising limits further.
function_parameter_count: 7

excluded:
  - Packages/TrinketContent/Sources/TrinketContent/Generated
  - .DerivedData
  - .build
  - build
  - "Packages/*/build"
  - "Packages/*/.build"

strict: true
